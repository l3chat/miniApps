<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef3ee">
  <title>RPN Calculator — Zoom App</title>
  <link rel="stylesheet" href="./zoom-shell.css">
  <script src="https://appssdk.zoom.us/sdk.js"></script>
  <script src="./zoom-bootstrap.js" defer></script>
</head>
<body>
  <main id="zoom-shell">
    <header id="zoom-toolbar" aria-live="polite">
      <button id="collaborate-button" type="button">Открыть участникам</button>
      <span id="zoom-status">Подключение к Zoom…</span>
    </header>
    <iframe
      id="calculator"
      src="./index.html"
      title="RPN Calculator"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </main>
</body>
</html>
