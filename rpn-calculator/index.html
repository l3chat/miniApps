<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef3ee">
  <title>RPN Calculator</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3ee;
      --panel: #ffffff;
      --entry-bg: #fff3c4;
      --ink: #17211c;
      --muted: #68766f;
      --line: #cfd9d2;
      --accent: #176b5b;
      --accent-strong: #0f4c41;
      --number: #f8faf8;
      --function: #e4ece7;
      --danger: #8f3c34;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    main {
      width: 100vw;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      padding:
        max(4px, env(safe-area-inset-top))
        max(4px, env(safe-area-inset-right))
        max(4px, env(safe-area-inset-bottom))
        max(4px, env(safe-area-inset-left));
    }

    .calculator {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 43fr) minmax(0, 57fr);
      gap: 5px;
    }

    .display-panel {
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(42px, 1fr) minmax(0, 6fr);
      gap: 4px;
    }

    .stack {
      min-height: 0;
      display: grid;
      grid-template-rows: repeat(6, minmax(0, 1fr));
      gap: 3px;
    }

    .stack-row,
    .entry-field {
      min-height: 0;
      display: grid;
      grid-template-columns: clamp(28px, 10vw, 46px) minmax(0, 1fr);
      align-items: center;
      padding: 0 clamp(8px, 2.5vw, 18px);
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
    }

    .stack-row.x-row {
      border-color: rgba(23, 107, 91, 0.7);
      box-shadow: inset 4px 0 0 var(--accent);
    }

    .entry-field {
      border: 2px solid #d2a900;
      background: var(--entry-bg);
      box-shadow: inset 4px 0 0 #d2a900;
    }

    .stack-label,
    .entry-label {
      color: var(--muted);
      font-size: clamp(0.72rem, 2.8vmin, 1rem);
      font-weight: 850;
    }

    .stack-value,
    .entry-value {
      min-width: 0;
      overflow: hidden;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: clamp(1rem, 5vmin, 2.1rem);
      font-variant-numeric: tabular-nums;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entry-value {
      font-size: clamp(1.08rem, 5.4vmin, 2.25rem);
    }

    .ghost-number {
      position: fixed;
      z-index: 1000;
      margin: 0;
      pointer-events: none;
      overflow: hidden;
      color: var(--ink);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
      transform-origin: center;
    }

    .keys {
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }

    button {
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--number);
      color: var(--ink);
      font: inherit;
      font-size: clamp(0.92rem, 4.1vmin, 1.65rem);
      font-weight: 820;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }

    button:active { transform: scale(0.97); }

    button:focus-visible {
      outline: 3px solid rgba(23, 107, 91, 0.25);
      outline-offset: -3px;
    }

    button:disabled {
      cursor: default;
    }

    .fn { background: var(--function); }
    .op { border-color: var(--accent); background: var(--accent); color: white; }
    .enter {
      grid-column: span 2;
      border-color: var(--accent-strong);
      background: var(--accent-strong);
      color: white;
    }
    .clear { color: var(--danger); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (orientation: landscape) {
      .calculator {
        grid-template-columns: minmax(0, 40fr) minmax(0, 60fr);
        grid-template-rows: 1fr;
      }

      .stack-row,
      .entry-field {
        grid-template-columns: clamp(30px, 5vw, 52px) minmax(0, 1fr);
        padding: 0 clamp(8px, 1.8vw, 18px);
      }

      .stack-value,
      .entry-value { font-size: clamp(1rem, 5.2vh, 2.15rem); }
      .stack-label,
      .entry-label { font-size: clamp(0.72rem, 2.7vh, 1rem); }
      button { font-size: clamp(0.88rem, 4vh, 1.5rem); }
    }
  </style>
</head>
<body>
  <main>
    <section class="calculator" aria-label="Калькулятор с обратной польской записью">
      <div class="display-panel">
        <div class="entry-field" aria-label="Поле ввода числа">
          <span class="entry-label">›</span>
          <span id="entryValue" class="entry-value"></span>
        </div>
        <div id="stack" class="stack" aria-live="polite"></div>
      </div>

      <div class="keys">
        <button class="fn" data-unary="reciprocal" aria-label="Обратная величина">1/x</button>
        <button class="fn" data-unary="square" aria-label="Квадрат">x²</button>
        <button class="fn" data-unary="cube" aria-label="Куб">x³</button>
        <button class="clear" data-action="clear">AC</button>

        <button class="fn" data-action="sign">±</button>
        <button class="fn" data-unary="sqrt" aria-label="Квадратный корень">√x</button>
        <button class="fn" data-unary="cbrt" aria-label="Кубический корень">∛x</button>
        <button class="fn" data-action="backspace" aria-label="Удалить последнюю цифру">⌫</button>

        <button data-digit="7">7</button>
        <button data-digit="8">8</button>
        <button data-digit="9">9</button>
        <button class="op" data-binary="/">÷</button>

        <button data-digit="4">4</button>
        <button data-digit="5">5</button>
        <button data-digit="6">6</button>
        <button class="op" data-binary="*">×</button>

        <button data-digit="1">1</button>
        <button data-digit="2">2</button>
        <button data-digit="3">3</button>
        <button class="op" data-binary="-">−</button>

        <button data-digit="0">0</button>
        <button data-action="decimal">.</button>
        <button class="fn" data-action="drop">DROP</button>
        <button class="op" data-binary="+">+</button>

        <button class="enter" data-action="enter">ENTER</button>
        <button class="fn" data-action="swap">X↔Y</button>
        <button class="fn" data-action="roll">R↓</button>
      </div>

      <div id="status" class="sr-only" aria-live="assertive"></div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const MAX_STACK = 6;
      const labels = ['X', 'Y', 'Z', 'T', 'U', 'V'];
      const MOVE_MS = 560;
      const EASE = 'cubic-bezier(.22,.75,.2,1)';

      let stack = [];
      let entry = '';
      let entering = false;
      let nextId = 1;
      let busy = false;

      const stackEl = document.getElementById('stack');
      const entryValueEl = document.getElementById('entryValue');
      const entryFieldEl = document.querySelector('.entry-field');
      const statusEl = document.getElementById('status');
      const keyButtons = [...document.querySelectorAll('.keys button')];

      function setStatus(message = '') {
        statusEl.textContent = message;
      }

      function setBusy(value) {
        busy = value;
        keyButtons.forEach(button => { button.disabled = value; });
      }

      function formatNumber(value) {
        if (!Number.isFinite(value)) return 'Error';
        if (Object.is(value, -0)) value = 0;
        const abs = Math.abs(value);
        if (abs !== 0 && (abs >= 1e12 || abs < 1e-9)) {
          return value.toExponential(10)
            .replace(/\.0+(?=e)/, '')
            .replace(/(\.\d*?)0+(?=e)/, '$1');
        }
        return Number(value.toPrecision(12)).toString();
      }

      function parsedEntry() {
        if (!entering || entry === '' || entry === '-' || entry === '.' || entry === '-.') return null;
        const value = Number(entry);
        return Number.isFinite(value) ? value : null;
      }

      function newItem(value) {
        return { id: String(nextId++), value };
      }

      function render() {
        stackEl.replaceChildren();
        const emptyRows = MAX_STACK - stack.length;

        for (let rowIndex = 0; rowIndex < MAX_STACK; rowIndex += 1) {
          const row = document.createElement('div');
          const stackIndex = rowIndex - emptyRows;
          const filled = stackIndex >= 0;
          const item = filled ? stack[stackIndex] : null;
          row.className = 'stack-row' + (filled && stackIndex === 0 ? ' x-row' : '');

          const label = document.createElement('span');
          label.className = 'stack-label';
          label.textContent = filled ? labels[stackIndex] : '';

          const value = document.createElement('span');
          value.className = 'stack-value';
          if (item) {
            value.dataset.itemId = item.id;
            value.textContent = formatNumber(item.value);
          } else {
            value.textContent = '';
          }

          row.append(label, value);
          stackEl.append(row);
        }

        entryValueEl.textContent = entering ? entry : '';
      }

      function captureStack() {
        const result = new Map();
        stackEl.querySelectorAll('.stack-value[data-item-id]').forEach(el => {
          const rect = el.getBoundingClientRect();
          result.set(el.dataset.itemId, {
            rect,
            text: el.textContent,
            fontSize: getComputedStyle(el).fontSize
          });
        });
        return result;
      }

      function captureElement(el, text = el.textContent) {
        const rect = el.getBoundingClientRect();
        return {
          rect,
          text,
          fontSize: getComputedStyle(el).fontSize
        };
      }

      function ghostFrom(state) {
        const ghost = document.createElement('div');
        ghost.className = 'ghost-number';
        ghost.textContent = state.text;
        Object.assign(ghost.style, {
          left: `${state.rect.left}px`,
          top: `${state.rect.top}px`,
          width: `${state.rect.width}px`,
          height: `${state.rect.height}px`,
          lineHeight: `${state.rect.height}px`,
          fontSize: state.fontSize
        });
        document.body.appendChild(ghost);
        return ghost;
      }

      function finished(animation) {
        return animation.finished.catch(() => undefined);
      }

      function nextFrame() {
        return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      }

      function animateLabels() {
        const animations = [];
        stackEl.querySelectorAll('.stack-label').forEach(label => {
          if (!label.textContent) return;
          animations.push(finished(label.animate(
            [{ opacity: 0.25 }, { opacity: 1 }],
            { duration: 300, delay: 170, easing: 'ease-out' }
          )));
        });
        return animations;
      }

      async function transition(mutator, options = {}) {
        const before = captureStack();
        if (options.extraBefore) {
          for (const [id, state] of options.extraBefore) before.set(String(id), state);
        }

        mutator();
        render();
        await nextFrame();

        const after = captureStack();
        const animations = [];
        const changed = new Set((options.changedIds || []).map(String));
        const removedTo = options.removedTo || {};

        for (const [id, newState] of after) {
          const el = stackEl.querySelector(`.stack-value[data-item-id="${id}"]`);
          const oldState = before.get(id);

          if (oldState) {
            const dx = oldState.rect.left - newState.rect.left;
            const dy = oldState.rect.top - newState.rect.top;
            const valueChanged = changed.has(id) || oldState.text !== newState.text;

            if (valueChanged && before.has(id)) {
              const oldGhost = ghostFrom(oldState);
              animations.push(finished(oldGhost.animate(
                [
                  { opacity: 1, transform: 'scale(1)' },
                  { opacity: 0, transform: 'scale(.82)' }
                ],
                { duration: MOVE_MS * 0.7, easing: 'ease-out', fill: 'forwards' }
              )).then(() => oldGhost.remove()));
            }

            const frames = [
              {
                transform: `translate(${dx}px, ${dy}px) scale(${valueChanged ? .86 : 1})`,
                opacity: valueChanged ? 0.15 : 1
              },
              { transform: 'translate(0, 0) scale(1.04)', opacity: 1, offset: 0.82 },
              { transform: 'translate(0, 0) scale(1)', opacity: 1 }
            ];
            animations.push(finished(el.animate(frames, {
              duration: MOVE_MS,
              easing: EASE
            })));
          } else {
            animations.push(finished(el.animate(
              [
                { opacity: 0, transform: 'scale(.7)' },
                { opacity: 1, transform: 'scale(1.06)', offset: .78 },
                { opacity: 1, transform: 'scale(1)' }
              ],
              { duration: MOVE_MS, easing: EASE }
            )));
          }
        }

        for (const [id, oldState] of before) {
          if (after.has(id)) continue;

          const ghost = ghostFrom(oldState);
          const targetId = removedTo[id];
          const target = targetId ? after.get(String(targetId)) : null;
          let dx = 0;
          let dy = -oldState.rect.height * 0.7;

          if (target) {
            dx = target.rect.left - oldState.rect.left;
            dy = target.rect.top - oldState.rect.top;
          }

          animations.push(finished(ghost.animate(
            [
              { opacity: 1, transform: 'translate(0, 0) scale(1)' },
              {
                opacity: target ? 0.2 : 0,
                transform: `translate(${dx}px, ${dy}px) scale(${target ? .72 : .82})`
              }
            ],
            { duration: MOVE_MS, easing: EASE, fill: 'forwards' }
          )).then(() => ghost.remove()));
        }

        animations.push(...animateLabels());
        await Promise.allSettled(animations);
      }

      function pushItem(item) {
        stack.unshift(item);
        if (stack.length > MAX_STACK) stack.length = MAX_STACK;
      }

      async function pulseEntry() {
        await finished(entryValueEl.animate(
          [
            { transform: 'scale(1)' },
            { transform: 'scale(1.06)', offset: .45 },
            { transform: 'scale(1)' }
          ],
          { duration: 170, easing: 'ease-out' }
        ));
      }

      async function shake(el = entryFieldEl) {
        await finished(el.animate(
          [
            { transform: 'translateX(0)' },
            { transform: 'translateX(-7px)' },
            { transform: 'translateX(7px)' },
            { transform: 'translateX(-4px)' },
            { transform: 'translateX(0)' }
          ],
          { duration: 300, easing: 'ease-out' }
        ));
      }

      async function beginDigit(digit) {
        if (!entering) {
          entry = '';
          entering = true;
        }
        if (entry === '0' && digit !== '0') entry = digit;
        else if (entry === '-0' && digit !== '0') entry = '-' + digit;
        else if (!(entry === '0' && digit === '0') && !(entry === '-0' && digit === '0')) entry += digit;
        setStatus();
        render();
        await pulseEntry();
      }

      async function decimal() {
        if (!entering) {
          entry = '0.';
          entering = true;
        } else if (!entry.includes('.')) {
          entry += entry === '-' ? '0.' : '.';
        }
        setStatus();
        render();
        await pulseEntry();
      }

      async function toggleSign() {
        if (entering) {
          entry = entry.startsWith('-') ? entry.slice(1) : '-' + entry;
          setStatus();
          render();
          await pulseEntry();
          return;
        }

        if (stack.length) {
          const id = stack[0].id;
          await transition(() => {
            stack[0] = { ...stack[0], value: -stack[0].value };
          }, { changedIds: [id] });
          setStatus();
          return;
        }

        entry = '-';
        entering = true;
        setStatus();
        render();
        await pulseEntry();
      }

      async function backspace() {
        if (!entering) return;
        entry = entry.slice(0, -1);
        if (!entry) entering = false;
        setStatus();
        render();
        await pulseEntry();
      }

      async function commitEntryAnimated() {
        if (!entering) return false;
        const value = parsedEntry();
        if (value === null) {
          setStatus('Некорректное число');
          await shake();
          return false;
        }

        const item = newItem(value);
        const source = captureElement(entryValueEl, entry);
        const extraBefore = new Map([[item.id, source]]);

        await transition(() => {
          pushItem(item);
          entry = '';
          entering = false;
        }, { extraBefore });

        setStatus();
        return true;
      }

      async function enter() {
        if (entering) {
          await commitEntryAnimated();
          return;
        }

        if (!stack.length) {
          setStatus('Сначала введите число');
          await shake();
          return;
        }

        const sourceEl = stackEl.querySelector(`.stack-value[data-item-id="${stack[0].id}"]`);
        const duplicate = newItem(stack[0].value);
        const source = captureElement(sourceEl, formatNumber(stack[0].value));
        const extraBefore = new Map([[duplicate.id, source]]);

        await transition(() => pushItem(duplicate), { extraBefore });
        setStatus();
      }

      async function binary(op) {
        if (entering && !(await commitEntryAnimated())) return;

        if (stack.length < 2) {
          setStatus('Недостаточно элементов');
          await shake(stackEl);
          return;
        }

        const x = stack[0];
        const y = stack[1];
        let result;

        if (op === '+') result = y.value + x.value;
        if (op === '-') result = y.value - x.value;
        if (op === '*') result = y.value * x.value;
        if (op === '/') {
          if (x.value === 0) {
            setStatus('Деление на ноль');
            await shake(stackEl);
            return;
          }
          result = y.value / x.value;
        }

        if (!Number.isFinite(result)) {
          setStatus('Результат вне диапазона');
          await shake(stackEl);
          return;
        }

        const resultId = y.id;
        const removedTo = { [x.id]: resultId };

        await transition(() => {
          stack.splice(0, 2, { id: resultId, value: result });
        }, {
          changedIds: [resultId],
          removedTo
        });
        setStatus();
      }

      async function unary(kind) {
        if (entering && !(await commitEntryAnimated())) return;

        if (!stack.length) {
          setStatus('Стек пуст');
          await shake(stackEl);
          return;
        }

        const x = stack[0];
        let result;

        switch (kind) {
          case 'reciprocal':
            if (x.value === 0) {
              setStatus('Деление на ноль');
              await shake(stackEl);
              return;
            }
            result = 1 / x.value;
            break;
          case 'square':
            result = x.value * x.value;
            break;
          case 'cube':
            result = x.value * x.value * x.value;
            break;
          case 'sqrt':
            if (x.value < 0) {
              setStatus('Квадратный корень отрицательного числа');
              await shake(stackEl);
              return;
            }
            result = Math.sqrt(x.value);
            break;
          case 'cbrt':
            result = Math.cbrt(x.value);
            break;
          default:
            return;
        }

        if (!Number.isFinite(result)) {
          setStatus('Результат вне диапазона');
          await shake(stackEl);
          return;
        }

        await transition(() => {
          stack[0] = { ...stack[0], value: result };
        }, { changedIds: [x.id] });
        setStatus();
      }

      async function drop() {
        if (entering) {
          const animation = entryValueEl.animate(
            [
              { opacity: 1, transform: 'translateY(0)' },
              { opacity: 0, transform: 'translateY(-18px) scale(.85)' }
            ],
            { duration: 320, easing: 'ease-in', fill: 'forwards' }
          );
          await finished(animation);
          entry = '';
          entering = false;
          render();
          setStatus();
          return;
        }

        if (stack.length) {
          await transition(() => stack.shift());
        }
        setStatus();
      }

      async function swap() {
        if (entering && !(await commitEntryAnimated())) return;

        if (stack.length < 2) {
          setStatus('Недостаточно элементов');
          await shake(stackEl);
          return;
        }

        await transition(() => {
          [stack[0], stack[1]] = [stack[1], stack[0]];
        }, { duration: 700 });
        setStatus();
      }

      async function rollDown() {
        if (entering && !(await commitEntryAnimated())) return;

        if (stack.length < 2) {
          setStatus('Недостаточно элементов');
          await shake(stackEl);
          return;
        }

        await transition(() => stack.push(stack.shift()));
        setStatus();
      }

      async function clearAll() {
        if (entering) {
          entry = '';
          entering = false;
          render();
        }
        if (stack.length) {
          await transition(() => { stack = []; });
        }
        setStatus();
      }

      async function runAction(action) {
        if (busy) return;
        setBusy(true);
        try {
          await action();
        } finally {
          setBusy(false);
        }
      }

      document.querySelector('.keys').addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button || busy) return;

        runAction(async () => {
          if (button.dataset.digit !== undefined) await beginDigit(button.dataset.digit);
          else if (button.dataset.binary) await binary(button.dataset.binary);
          else if (button.dataset.unary) await unary(button.dataset.unary);
          else {
            switch (button.dataset.action) {
              case 'decimal': await decimal(); break;
              case 'sign': await toggleSign(); break;
              case 'backspace': await backspace(); break;
              case 'enter': await enter(); break;
              case 'drop': await drop(); break;
              case 'swap': await swap(); break;
              case 'roll': await rollDown(); break;
              case 'clear': await clearAll(); break;
            }
          }
        });
      });

      window.addEventListener('keydown', event => {
        if (busy) return;

        let action = null;
        if (/^[0-9]$/.test(event.key)) action = () => beginDigit(event.key);
        else if (event.key === '.' || event.key === ',') action = decimal;
        else if (event.key === 'Enter') action = enter;
        else if (['+', '-', '*', '/'].includes(event.key)) {
          action = event.key === '-' && entering && (entry === '' || entry === '-')
            ? toggleSign
            : () => binary(event.key);
        }
        else if (event.key === 'Backspace') action = backspace;
        else if (event.key === 'Escape') action = clearAll;

        if (action) {
          event.preventDefault();
          runAction(action);
        }
      });

      render();
    })();
  </script>
