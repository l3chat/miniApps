<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3ee">
<title>RPN Calculator</title>
<style>
:root{color-scheme:light;--bg:#eef3ee;--panel:#fff;--rpn:#dfeefb;--alg:#e5f2e8;--entry:#fff3c4;--ink:#17211c;--muted:#68766f;--line:#cfd9d2;--accent:#176b5b;--strong:#0f4c41;--fn:#e4ece7;--danger:#8f3c34;--ok:#d8f5dc;--okl:#3b9860;--bad:#ffdede;--badl:#c85151}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}body{color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}main{width:100vw;height:100dvh;padding:max(4px,env(safe-area-inset-top)) max(4px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left))}.app{height:100%;display:grid;grid-template-rows:38px minmax(0,1fr);gap:4px}.mode-bar{display:grid;grid-template-columns:1fr 1fr;gap:5px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.mode{border:0;border-radius:6px;background:transparent;color:var(--muted);font:850 clamp(.72rem,3.1vmin,1rem) inherit;cursor:pointer}.mode.active{background:var(--strong);color:#fff}.calc-mode #trainMode{opacity:.38}.calculator{min-height:0;display:grid;grid-template-rows:minmax(0,52fr) minmax(0,48fr);gap:5px}.calc-mode .calculator{grid-template-rows:minmax(0,43fr) minmax(0,57fr)}.display{min-height:0;display:grid;grid-template-rows:minmax(34px,.72fr) minmax(34px,.72fr) minmax(42px,1fr) minmax(0,6fr);gap:4px}.calc-mode .display{grid-template-rows:minmax(42px,1fr) minmax(0,6fr)}.calc-mode .exercise{display:none}.exercise,.stack-row,.entry{min-height:0;display:grid;grid-template-columns:clamp(58px,16vw,90px) minmax(0,1fr);align-items:center;padding:0 clamp(8px,2.5vw,18px);border:1px solid var(--line);border-radius:7px;background:var(--panel)}.exercise.rpn{background:var(--rpn);border-color:#9fc8e6}.exercise.alg{background:var(--alg);border-color:#a8cfb1}.exercise.target{box-shadow:inset 5px 0 0 var(--accent)}.exercise.correct{background:var(--ok);border-color:var(--okl);box-shadow:inset 5px 0 0 var(--okl)}.exercise.wrong{background:var(--bad);border-color:var(--badl);box-shadow:inset 5px 0 0 var(--badl)}.ex-label{font-size:clamp(.9rem,3.5vmin,1.35rem);font-weight:900}.ex-input{width:100%;height:100%;border:0;outline:0;background:transparent;color:var(--ink);font-family:Consolas,monospace;font-size:clamp(1rem,4.6vmin,1.85rem);font-weight:800;text-align:right}.ex-input[readonly]{color:#43524a}.stack{min-height:0;display:grid;grid-template-rows:repeat(6,minmax(0,1fr));gap:3px}.stack-row.x{border-color:rgba(23,107,91,.7);box-shadow:inset 4px 0 0 var(--accent)}.entry{border:2px solid #d2a900;background:var(--entry);box-shadow:inset 4px 0 0 #d2a900}.stack-label,.entry-label{color:var(--muted);font-size:clamp(1.15rem,5.5vmin,2.3rem);font-weight:900}.stack-value,.entry-value{min-width:0;overflow:hidden;font-family:Consolas,monospace;font-size:clamp(2rem,12vmin,5rem);font-weight:900;line-height:1;text-align:right;text-overflow:ellipsis;white-space:nowrap}.entry-value{font-size:clamp(2.2rem,13vmin,5.4rem)}.ghost{position:fixed;z-index:1000;pointer-events:none;overflow:hidden;color:var(--ink);font-family:Consolas,monospace;font-weight:900;text-align:right;white-space:nowrap;transform-origin:center}.keys{min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(7,1fr);gap:4px}.keys button{min-width:0;min-height:0;padding:0;border:1px solid var(--line);border-radius:8px;background:#f8faf8;color:var(--ink);font:820 clamp(.92rem,4.1vmin,1.65rem) inherit;cursor:pointer;touch-action:manipulation}.keys button:active{transform:scale(.97)}.keys button:disabled{cursor:default}.fn{background:var(--fn)!important}.op{border-color:var(--accent)!important;background:var(--accent)!important;color:#fff!important}.enter-btn{grid-column:span 2;border-color:var(--strong)!important;background:var(--strong)!important;color:#fff!important}.clear{color:var(--danger)!important}.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(orientation:landscape){.app{grid-template-rows:34px minmax(0,1fr)}.calculator{grid-template-columns:minmax(0,43fr) minmax(0,57fr);grid-template-rows:1fr}.calc-mode .calculator{grid-template-columns:minmax(0,40fr) minmax(0,60fr);grid-template-rows:1fr}.display{grid-template-rows:minmax(30px,.7fr) minmax(30px,.7fr) minmax(36px,.9fr) minmax(0,6fr)}.calc-mode .display{grid-template-rows:minmax(38px,.9fr) minmax(0,6fr)}.exercise,.stack-row,.entry{grid-template-columns:clamp(58px,7vw,92px) minmax(0,1fr);padding:0 clamp(8px,1.8vw,18px)}.ex-input{font-size:clamp(.9rem,4vh,1.7rem)}.stack-value,.entry-value{font-size:clamp(1.8rem,12vh,4.8rem)}.stack-label,.entry-label{font-size:clamp(1.1rem,5.8vh,2.2rem)}.keys button{font-size:clamp(.88rem,4vh,1.5rem)}}
</style>
</head>
<body><main><div id="app" class="app calc-mode">
<div class="mode-bar"><div class="seg"><button class="mode active" data-app="calc">Calc</button><button class="mode" data-app="train">Train</button></div><div id="trainMode" class="seg"><button class="mode active" data-train="auto">Auto</button><button class="mode" data-train="manual">Manual</button></div></div>
<section class="calculator"><div class="display">
<label id="rpnBox" class="exercise rpn"><span class="ex-label">RPN</span><input id="rpn" class="ex-input" autocomplete="off" spellcheck="false"></label>
<label id="algBox" class="exercise alg"><span class="ex-label">Alg</span><input id="alg" class="ex-input" autocomplete="off" spellcheck="false"></label>
<div class="entry"><span class="entry-label">›</span><span id="entry" class="entry-value"></span></div><div id="stack" class="stack"></div></div>
<div class="keys">
<button class="fn" data-u="reciprocal">1/x</button><button class="fn" data-u="square">x²</button><button class="fn" data-u="cube">x³</button><button class="clear" data-a="clear">AC</button>
<button class="fn" data-a="sign">±</button><button class="fn" data-u="sqrt">√x</button><button class="fn" data-u="cbrt">∛x</button><button class="fn" data-a="back">⌫</button>
<button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button><button class="op" data-b="/">÷</button>
<button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button><button class="op" data-b="*">×</button>
<button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button><button class="op" data-b="-">−</button>
<button data-d="0">0</button><button data-a="decimal">.</button><button class="fn" data-a="drop">DROP</button><button class="op" data-b="+">+</button>
<button class="enter-btn" data-a="enter">ENTER</button><button class="fn" data-a="swap">X↔Y</button><button class="fn" data-a="roll">R↓</button>
</div><div id="status" class="sr"></div></section></div></main>
<script>
(()=>{'use strict';
const MAX=6,L=['X','Y','Z','T','U','V'],MOVE=1050,EASE='cubic-bezier(.22,.75,.2,1)';let S=[],E='',typing=false,id=1,busy=false,appMode='calc',trainMode='auto',exercise=null,timer=null,nextDir='algToRpn';
const $=s=>document.querySelector(s),app=$('#app'),stack=$('#stack'),entry=$('#entry'),entryBox=$('.entry'),status=$('#status'),keys=[...document.querySelectorAll('.keys button')],rpn=$('#rpn'),alg=$('#alg'),rpnBox=$('#rpnBox'),algBox=$('#algBox'),appBtns=[...document.querySelectorAll('[data-app]')],trainBtns=[...document.querySelectorAll('[data-train]')];
const setStatus=m=>status.textContent=m||'',finish=a=>a.finished.catch(()=>{}),frame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
function setBusy(v){busy=v;keys.forEach(b=>b.disabled=v)}function fmt(v){if(Object.is(v,-0))v=0;const a=Math.abs(v);return a&&(a>=1e12||a<1e-9)?v.toExponential(10):Number(v.toPrecision(12)).toString()}function valEntry(){if(!typing||['','-','.','-.'].includes(E))return null;const v=Number(E);return Number.isFinite(v)?v:null}function item(v){return{id:String(id++),value:v}}
function render(){stack.replaceChildren();const empty=MAX-S.length;for(let r=0;r<MAX;r++){const i=r-empty,filled=i>=0,row=document.createElement('div');row.className='stack-row'+(filled&&i===0?' x':'');const l=document.createElement('span');l.className='stack-label';l.textContent=filled?L[i]:'';const v=document.createElement('span');v.className='stack-value';if(filled){v.dataset.id=S[i].id;v.textContent=fmt(S[i].value)}row.append(l,v);stack.append(row)}entry.textContent=typing?E:''}
function capture(){const m=new Map();stack.querySelectorAll('.stack-value[data-id]').forEach(el=>{const rect=el.getBoundingClientRect();m.set(el.dataset.id,{rect,text:el.textContent,size:getComputedStyle(el).fontSize})});return m}function capEl(el,text=el.textContent){return{rect:el.getBoundingClientRect(),text,size:getComputedStyle(el).fontSize}}function ghost(s){const g=document.createElement('div');g.className='ghost';g.textContent=s.text;Object.assign(g.style,{left:s.rect.left+'px',top:s.rect.top+'px',width:s.rect.width+'px',height:s.rect.height+'px',lineHeight:s.rect.height+'px',fontSize:s.size});document.body.append(g);return g}
async function transition(mut,opt={}){const before=capture();if(opt.extra)for(const[k,v]of opt.extra)before.set(String(k),v);mut();render();await frame();const after=capture(),A=[],changed=new Set((opt.changed||[]).map(String)),to=opt.to||{};for(const[k,n]of after){const el=stack.querySelector(`[data-id="${k}"]`),o=before.get(k);if(o){const dx=o.rect.left-n.rect.left,dy=o.rect.top-n.rect.top,c=changed.has(k)||o.text!==n.text;if(c){const g=ghost(o);A.push(finish(g.animate([{opacity:1},{opacity:0,transform:'scale(.82)'}],{duration:MOVE*.7,fill:'forwards'})).then(()=>g.remove()))}A.push(finish(el.animate([{transform:`translate(${dx}px,${dy}px) scale(${c?.86:1})`,opacity:c?.15:1},{transform:'translate(0,0) scale(1)'}],{duration:MOVE,easing:EASE})))}else A.push(finish(el.animate([{opacity:0,transform:'scale(.7)'},{opacity:1,transform:'scale(1)'}],{duration:MOVE,easing:EASE})))}for(const[k,o]of before){if(after.has(k))continue;const g=ghost(o),t=to[k]?after.get(String(to[k])):null,dx=t?t.rect.left-o.rect.left:0,dy=t?t.rect.top-o.rect.top:-o.rect.height*.7;A.push(finish(g.animate([{opacity:1},{opacity:t?.2:0,transform:`translate(${dx}px,${dy}px) scale(.75)`}],{duration:MOVE,easing:EASE,fill:'forwards'})).then(()=>g.remove()))}await Promise.allSettled(A)}
function push(x){S.unshift(x);if(S.length>MAX)S.length=MAX}function pulse(){entry.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:680})}async function shake(el=entryBox){await finish(el.animate([{transform:'translateX(0)'},{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(0)'}],{duration:450}))}
function digit(d){if(!typing){E='';typing=true}if(E==='0'&&d!=='0')E=d;else if(E==='-0'&&d!=='0')E='-'+d;else if(!((E==='0'||E==='-0')&&d==='0'))E+=d;render();pulse()}function decimal(){if(!typing){E='0.';typing=true}else if(!E.includes('.'))E+=E==='-'?'0.':'.';render();pulse()}function back(){if(!typing)return;E=E.slice(0,-1);if(!E)typing=false;render();pulse()}
async function sign(){if(typing){E=E.startsWith('-')?E.slice(1):'-'+E;render();pulse();return}if(S.length){const k=S[0].id;await transition(()=>S[0]={...S[0],value:-S[0].value},{changed:[k]});return}E='-';typing=true;render();pulse()}
async function commit(){const v=valEntry();if(v===null){await shake();return false}const x=item(v),src=capEl(entry,E);await transition(()=>{push(x);E='';typing=false},{extra:new Map([[x.id,src]])});return true}async function enterOp(){if(typing){await commit();return}if(!S.length){await shake();return}const srcEl=stack.querySelector(`[data-id="${S[0].id}"]`),x=item(S[0].value),src=capEl(srcEl);await transition(()=>push(x),{extra:new Map([[x.id,src]])})}
async function binary(op){if(typing&&!(await commit()))return;if(S.length<2){await shake(stack);return}const x=S[0],y=S[1];if(op==='/'&&x.value===0){await shake(stack);return}const v=op==='+'?y.value+x.value:op==='-'?y.value-x.value:op==='*'?y.value*x.value:y.value/x.value,k=y.id;await transition(()=>S.splice(0,2,{id:k,value:v}),{changed:[k],to:{[x.id]:k}})}
async function unary(kind){if(typing&&!(await commit()))return;if(!S.length){await shake(stack);return}const x=S[0];let v;if(kind==='reciprocal'){if(x.value===0){await shake(stack);return}v=1/x.value}else if(kind==='square')v=x.value*x.value;else if(kind==='cube')v=x.value*x.value*x.value;else if(kind==='sqrt'){if(x.value<0){await shake(stack);return}v=Math.sqrt(x.value)}else v=Math.cbrt(x.value);await transition(()=>S[0]={...S[0],value:v},{changed:[x.id]})}
async function drop(){if(typing){E='';typing=false;render();return}if(S.length)await transition(()=>S.shift())}async function swap(){if(typing&&!(await commit()))return;if(S.length<2){await shake(stack);return}await transition(()=>[S[0],S[1]]=[S[1],S[0]])}async function roll(){if(typing&&!(await commit()))return;if(S.length<2){await shake(stack);return}await transition(()=>S.push(S.shift()))}async function clearAll(){E='';typing=false;if(S.length)await transition(()=>S=[]);else render()}
async function run(fn){if(busy)return;setBusy(true);try{await fn()}finally{setBusy(false)}}
const OPS=[['+','+'],['-','−'],['*','×'],['/','÷']];const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function makeEx(){const a=rnd(2,9),b=rnd(2,9),c=rnd(2,9),o1=OPS[rnd(0,3)],o2=OPS[rnd(0,3)],s=rnd(0,1);return s?{alg:`${a} ${o1[1]} (${b} ${o2[1]} ${c})`,rpn:`${a} ${b} ${c} ${o2[0]} ${o1[0]}`}:{alg:`(${a} ${o1[1]} ${b}) ${o2[1]} ${c}`,rpn:`${a} ${b} ${o1[0]} ${c} ${o2[0]}`}}
const normOps=t=>t.replace(/[×xX]/g,'*').replace(/[÷:]/g,'/').replace(/−/g,'-'),normRpn=t=>normOps(t).trim().replace(/([+\-*/])/g,' $1 ').replace(/\s+/g,' ').trim();function infix(t){const n=normOps(t).replace(/\s+/g,'');if(!n)return null;const T=n.match(/\d+(?:\.\d+)?|[()+\-*/]/g);if(!T||T.join('')!==n)return null;const out=[],ops=[],p={'+':1,'-':1,'*':2,'/':2};let need=true;for(const x of T){if(/^\d/.test(x)){if(!need)return null;out.push(x);need=false}else if(x==='('){if(!need)return null;ops.push(x)}else if(x===')'){if(need)return null;let ok=false;while(ops.length){const q=ops.pop();if(q==='('){ok=true;break}out.push(q)}if(!ok)return null;need=false}else{if(need)return null;while(ops.length&&ops.at(-1)!=='('&&p[ops.at(-1)]>=p[x])out.push(ops.pop());ops.push(x);need=true}}if(need)return null;while(ops.length){const q=ops.pop();if(q==='(')return null;out.push(q)}return normRpn(out.join(' '))}
function clearMark(){rpnBox.classList.remove('target','correct','wrong');algBox.classList.remove('target','correct','wrong')}function cancel(){if(timer){clearTimeout(timer);timer=null}}function target(){return exercise?.direction==='algToRpn'?rpn:alg}function targetBox(){return exercise?.direction==='algToRpn'?rpnBox:algBox}function configure(){clearMark();if(trainMode==='manual'){rpn.readOnly=alg.readOnly=false;rpn.tabIndex=alg.tabIndex=0;return}const a=exercise?.direction==='algToRpn';rpn.readOnly=!a;alg.readOnly=a;rpn.tabIndex=a?0:-1;alg.tabIndex=a?-1:0;targetBox().classList.add('target')}
function newExercise(){cancel();if(trainMode!=='auto')return;exercise={...makeEx(),direction:nextDir};nextDir=nextDir==='algToRpn'?'rpnToAlg':'algToRpn';if(exercise.direction==='algToRpn'){alg.value=exercise.alg;rpn.value=''}else{rpn.value=exercise.rpn;alg.value=''}configure();if(appMode==='train')requestAnimationFrame(()=>{target().focus();target().select()})}
async function checkAuto(){const exp=normRpn(exercise.rpn),ok=exercise.direction==='algToRpn'?normRpn(rpn.value)===exp:infix(alg.value)===exp;clearMark();const b=targetBox();if(ok){b.classList.add('correct');if(exercise.direction==='algToRpn')rpn.value=exp;else alg.value=exercise.alg;timer=setTimeout(newExercise,1200)}else{b.classList.add('wrong');await shake(b);b.classList.add('target')}}async function checkManual(){clearMark();const a=normRpn(rpn.value),b=infix(alg.value);if(!a||!b){if(!a)rpnBox.classList.add('wrong');if(!b)algBox.classList.add('wrong');return}const ok=a===b;rpnBox.classList.add(ok?'correct':'wrong');algBox.classList.add(ok?'correct':'wrong');if(!ok)await Promise.all([shake(rpnBox),shake(algBox)])}
function setApp(m){appMode=m;app.classList.toggle('calc-mode',m==='calc');app.classList.toggle('train-mode',m==='train');appBtns.forEach(b=>b.classList.toggle('active',b.dataset.app===m));if(m==='calc'){cancel();if(document.activeElement===rpn||document.activeElement===alg)document.activeElement.blur()}else if(trainMode==='auto'){if(!exercise)newExercise();else{configure();requestAnimationFrame(()=>target().focus())}}}function setTrain(m){trainMode=m;trainBtns.forEach(b=>b.classList.toggle('active',b.dataset.train===m));cancel();if(m==='manual'){exercise=null;clearMark();rpn.readOnly=alg.readOnly=false;rpn.tabIndex=alg.tabIndex=0}else newExercise()}
appBtns.forEach(b=>b.onclick=()=>setApp(b.dataset.app));trainBtns.forEach(b=>b.onclick=()=>setTrain(b.dataset.train));document.querySelector('.keys').onclick=e=>{const b=e.target.closest('button');if(!b||busy)return;if(b.dataset.d!==undefined){digit(b.dataset.d);return}if(b.dataset.a==='decimal'){decimal();return}if(b.dataset.a==='back'){back();return}if(b.dataset.a==='sign'&&(typing||!S.length)){sign();return}run(async()=>{if(b.dataset.b)await binary(b.dataset.b);else if(b.dataset.u)await unary(b.dataset.u);else if(b.dataset.a==='sign')await sign();else if(b.dataset.a==='enter')await enterOp();else if(b.dataset.a==='drop')await drop();else if(b.dataset.a==='swap')await swap();else if(b.dataset.a==='roll')await roll();else if(b.dataset.a==='clear')await clearAll()})};
function exInput(){clearMark()}rpn.oninput=alg.oninput=exInput;function exKey(e){if(e.key==='Enter'){e.preventDefault();trainMode==='auto'?checkAuto():checkManual()}else if(e.key==='Escape'){e.preventDefault();trainMode==='auto'?newExercise():clearMark()}}rpn.onkeydown=alg.onkeydown=exKey;window.addEventListener('keydown',e=>{if(e.target.classList?.contains('ex-input'))return;if(busy)return;if(/^\d$/.test(e.key)){e.preventDefault();digit(e.key)}else if(e.key==='.'||e.key===','){e.preventDefault();decimal()}else if(e.key==='Backspace'){e.preventDefault();back()}else if(e.key==='Enter'){e.preventDefault();run(enterOp)}else if(['+','-','*','/'].includes(e.key)){e.preventDefault();run(()=>binary(e.key))}else if(e.key==='Escape'){e.preventDefault();run(clearAll)}});
setApp('calc');setTrain('auto');render();
})();
</script></body></html>
