<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef3ee">
  <title>RPN Calculator</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#eef3ee;
      --panel:#ffffff;
      --rpn-bg:#dfeefb;
      --alg-bg:#e5f2e8;
      --entry-bg:#fff3c4;
      --ink:#17211c;
      --muted:#68766f;
      --line:#cfd9d2;
      --accent:#176b5b;
      --accent-strong:#0f4c41;
      --number:#f8faf8;
      --function:#e4ece7;
      --danger:#8f3c34;
      --ok-bg:#d8f5dc;
      --ok-line:#3b9860;
      --bad-bg:#ffdede;
      --bad-line:#c85151;
    }

    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); }
    body {
      color:var(--ink);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-tap-highlight-color:transparent;
      overscroll-behavior:none;
    }
    main {
      width:100vw;
      height:100vh;
      height:100svh;
      height:100dvh;
      padding:max(4px,env(safe-area-inset-top)) max(4px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left));
    }

    .app {
      width:100%;
      height:100%;
      display:grid;
      grid-template-rows:38px minmax(0,1fr);
      gap:4px;
    }

    .mode-bar {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:5px;
      min-height:0;
    }

    .segmented {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:2px;
      padding:2px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--panel);
    }

    .mode-button {
      min-width:0;
      min-height:0;
      border:0;
      border-radius:6px;
      background:transparent;
      color:var(--muted);
      font:inherit;
      font-size:clamp(.72rem,3.1vmin,1rem);
      font-weight:850;
      cursor:pointer;
      touch-action:manipulation;
    }

    .mode-button.active {
      background:var(--accent-strong);
      color:#fff;
    }

    .app.calc-mode #trainingModeControl {
      opacity:.38;
    }

    .calculator {
      width:100%;
      height:100%;
      min-height:0;
      display:grid;
      grid-template-rows:minmax(0,52fr) minmax(0,48fr);
      gap:5px;
    }

    .app.calc-mode .calculator {
      grid-template-rows:minmax(0,43fr) minmax(0,57fr);
    }

    .display-panel {
      min-height:0;
      display:grid;
      grid-template-rows:minmax(34px,.72fr) minmax(34px,.72fr) minmax(42px,1fr) minmax(0,6fr);
      gap:4px;
    }

    .app.calc-mode .display-panel {
      grid-template-rows:minmax(42px,1fr) minmax(0,6fr);
    }

    .app.calc-mode .exercise-field {
      display:none;
    }

    .exercise-field,
    .stack-row,
    .entry-field {
      min-height:0;
      display:grid;
      grid-template-columns:clamp(58px,16vw,90px) minmax(0,1fr);
      align-items:center;
      padding:0 clamp(8px,2.5vw,18px);
      border:1px solid var(--line);
      border-radius:7px;
      background:var(--panel);
    }

    .exercise-field.rpn {
      background:var(--rpn-bg);
      border-color:#9fc8e6;
      transition:background-color .18s,border-color .18s,box-shadow .18s;
    }
    .exercise-field.alg {
      background:var(--alg-bg);
      border-color:#a8cfb1;
      transition:background-color .18s,border-color .18s,box-shadow .18s;
    }
    .exercise-field.target {
      box-shadow:inset 5px 0 0 var(--accent);
    }
    .exercise-field.correct {
      background:var(--ok-bg);
      border-color:var(--ok-line);
      box-shadow:inset 5px 0 0 var(--ok-line);
    }
    .exercise-field.wrong {
      background:var(--bad-bg);
      border-color:var(--bad-line);
      box-shadow:inset 5px 0 0 var(--bad-line);
    }
    .exercise-label {
      font-size:clamp(.9rem,3.5vmin,1.35rem);
      font-weight:900;
      color:var(--ink);
    }
    .exercise-input {
      width:100%;
      min-width:0;
      height:100%;
      border:0;
      outline:0;
      padding:0;
      background:transparent;
      color:var(--ink);
      font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
      font-size:clamp(1rem,4.6vmin,1.85rem);
      font-weight:800;
      text-align:right;
    }
    .exercise-input[readonly] {
      color:#43524a;
    }

    .stack {
      min-height:0;
      display:grid;
      grid-template-rows:repeat(6,minmax(0,1fr));
      gap:3px;
    }
    .stack-row.x-row {
      border-color:rgba(23,107,91,.7);
      box-shadow:inset 4px 0 0 var(--accent);
    }
    .entry-field {
      border:2px solid #d2a900;
      background:var(--entry-bg);
      box-shadow:inset 4px 0 0 #d2a900;
    }
    .stack-label,.entry-label {
      color:var(--muted);
      font-size:clamp(1.15rem,5.5vmin,2.3rem);
      font-weight:900;
      line-height:1;
    }
    .stack-value,.entry-value {
      min-width:0;
      overflow:hidden;
      font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
      font-size:clamp(2rem,12vmin,5rem);
      font-weight:900;
      line-height:1;
      font-variant-numeric:tabular-nums;
      text-align:right;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .entry-value { font-size:clamp(2.2rem,13vmin,5.4rem); }

    .ghost-number {
      position:fixed;
      z-index:1000;
      margin:0;
      pointer-events:none;
      overflow:hidden;
      color:var(--ink);
      font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
      font-weight:900;
      font-variant-numeric:tabular-nums;
      text-align:right;
      white-space:nowrap;
      transform-origin:center;
    }

    .keys {
      min-height:0;
      height:100%;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      grid-template-rows:repeat(7,minmax(0,1fr));
      gap:4px;
    }
    .keys button {
      min-width:0;
      min-height:0;
      padding:0;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--number);
      color:var(--ink);
      font:inherit;
      font-size:clamp(.92rem,4.1vmin,1.65rem);
      font-weight:820;
      cursor:pointer;
      touch-action:manipulation;
      user-select:none;
    }
    .keys button:active { transform:scale(.97); }
    .keys button:focus-visible { outline:3px solid rgba(23,107,91,.25); outline-offset:-3px; }
    .keys button:disabled { cursor:default; }
    .fn { background:var(--function)!important; }
    .op { border-color:var(--accent)!important; background:var(--accent)!important; color:white!important; }
    .enter { grid-column:span 2; border-color:var(--accent-strong)!important; background:var(--accent-strong)!important; color:white!important; }
    .clear { color:var(--danger)!important; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    @media (orientation:landscape) {
      .app { grid-template-rows:34px minmax(0,1fr); }
      .calculator { grid-template-columns:minmax(0,43fr) minmax(0,57fr); grid-template-rows:1fr; }
      .app.calc-mode .calculator { grid-template-columns:minmax(0,40fr) minmax(0,60fr); grid-template-rows:1fr; }
      .display-panel { grid-template-rows:minmax(30px,.7fr) minmax(30px,.7fr) minmax(36px,.9fr) minmax(0,6fr); }
      .app.calc-mode .display-panel { grid-template-rows:minmax(38px,.9fr) minmax(0,6fr); }
      .exercise-field,.stack-row,.entry-field { grid-template-columns:clamp(58px,7vw,92px) minmax(0,1fr); padding:0 clamp(8px,1.8vw,18px); }
      .exercise-input { font-size:clamp(.9rem,4vh,1.7rem); }
      .exercise-label { font-size:clamp(.82rem,3.2vh,1.25rem); }
      .stack-value,.entry-value { font-size:clamp(1.8rem,12vh,4.8rem); }
      .stack-label,.entry-label { font-size:clamp(1.1rem,5.8vh,2.2rem); }
      .keys button { font-size:clamp(.88rem,4vh,1.5rem); }
      .mode-button { font-size:clamp(.7rem,2.8vh,.95rem); }
    }
  </style>
</head>
<body>
  <main>
    <div id="app" class="app train-mode">
      <div class="mode-bar">
        <div class="segmented" aria-label="Режим приложения">
          <button class="mode-button" data-app-mode="calc">Calc</button>
          <button class="mode-button active" data-app-mode="train">Train</button>
        </div>
        <div id="trainingModeControl" class="segmented" aria-label="Режим тренажёра">
          <button class="mode-button active" data-training-mode="auto">Auto</button>
          <button class="mode-button" data-training-mode="manual">Manual</button>
        </div>
      </div>

      <section class="calculator" aria-label="Калькулятор с обратной польской записью">
        <div class="display-panel">
          <label id="rpnExerciseField" class="exercise-field rpn">
            <span class="exercise-label">RPN</span>
            <input id="rpnExercise" class="exercise-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="RPN">
          </label>
          <label id="algExerciseField" class="exercise-field alg">
            <span class="exercise-label">Alg</span>
            <input id="algExercise" class="exercise-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Алгебраическая запись">
          </label>
          <div class="entry-field" aria-label="Поле ввода числа">
            <span class="entry-label">›</span><span id="entryValue" class="entry-value"></span>
          </div>
          <div id="stack" class="stack" aria-live="polite"></div>
        </div>

        <div class="keys">
          <button class="fn" data-unary="reciprocal">1/x</button><button class="fn" data-unary="square">x²</button><button class="fn" data-unary="cube">x³</button><button class="clear" data-action="clear">AC</button>
          <button class="fn" data-action="sign">±</button><button class="fn" data-unary="sqrt">√x</button><button class="fn" data-unary="cbrt">∛x</button><button class="fn" data-action="backspace">⌫</button>
          <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button class="op" data-binary="/">÷</button>
          <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button class="op" data-binary="*">×</button>
          <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button class="op" data-binary="-">−</button>
          <button data-digit="0">0</button><button data-action="decimal">.</button><button class="fn" data-action="drop">DROP</button><button class="op" data-binary="+">+</button>
          <button class="enter" data-action="enter">ENTER</button><button class="fn" data-action="swap">X↔Y</button><button class="fn" data-action="roll">R↓</button>
        </div>
        <div id="status" class="sr-only" aria-live="assertive"></div>
      </section>
    </div>
  </main>

<script>
(() => {
'use strict';

const MAX_STACK=6;
const labels=['X','Y','Z','T','U','V'];
const MOVE_MS=1050;
const EASE='cubic-bezier(.22,.75,.2,1)';

let stack=[];
let entry='';
let entering=false;
let nextId=1;
let busy=false;
let appMode='train';
let trainingMode='auto';
let currentExercise=null;
let nextExerciseTimer=null;
let nextDirection='algToRpn';

const appEl=document.getElementById('app');
const stackEl=document.getElementById('stack');
const entryValueEl=document.getElementById('entryValue');
const entryFieldEl=document.querySelector('.entry-field');
const statusEl=document.getElementById('status');
const keyButtons=[...document.querySelectorAll('.keys button')];
const appModeButtons=[...document.querySelectorAll('[data-app-mode]')];
const trainingModeButtons=[...document.querySelectorAll('[data-training-mode]')];
const rpnExerciseEl=document.getElementById('rpnExercise');
const algExerciseEl=document.getElementById('algExercise');
const rpnExerciseFieldEl=document.getElementById('rpnExerciseField');
const algExerciseFieldEl=document.getElementById('algExerciseField');

function setStatus(message=''){statusEl.textContent=message}
function setBusy(value){busy=value;keyButtons.forEach(button=>button.disabled=value)}

function formatNumber(value){
  if(!Number.isFinite(value))return'Error';
  if(Object.is(value,-0))value=0;
  const abs=Math.abs(value);
  if(abs!==0&&(abs>=1e12||abs<1e-9)){
    return value.toExponential(10).replace(/\.0+(?=e)/,'').replace(/(\.\d*?)0+(?=e)/,'$1');
  }
  return Number(value.toPrecision(12)).toString();
}

function parsedEntry(){
  if(!entering||entry===''||entry==='-'||entry==='.'||entry==='-.')return null;
  const value=Number(entry);
  return Number.isFinite(value)?value:null;
}

function newItem(value){return{id:String(nextId++),value}}

function render(){
  stackEl.replaceChildren();
  const empty=MAX_STACK-stack.length;
  for(let rowIndex=0;rowIndex<MAX_STACK;rowIndex++){
    const row=document.createElement('div');
    const stackIndex=rowIndex-empty;
    const filled=stackIndex>=0;
    const item=filled?stack[stackIndex]:null;
    row.className='stack-row'+(filled&&stackIndex===0?' x-row':'');

    const label=document.createElement('span');
    label.className='stack-label';
    label.textContent=filled?labels[stackIndex]:'';

    const value=document.createElement('span');
    value.className='stack-value';
    if(item){
      value.dataset.itemId=item.id;
      value.textContent=formatNumber(item.value);
    }
    row.append(label,value);
    stackEl.append(row);
  }
  entryValueEl.textContent=entering?entry:'';
}

function captureStack(){
  const result=new Map();
  stackEl.querySelectorAll('.stack-value[data-item-id]').forEach(el=>{
    const rect=el.getBoundingClientRect();
    result.set(el.dataset.itemId,{rect,text:el.textContent,fontSize:getComputedStyle(el).fontSize});
  });
  return result;
}

function captureElement(el,text=el.textContent){
  const rect=el.getBoundingClientRect();
  return{rect,text,fontSize:getComputedStyle(el).fontSize};
}

function ghostFrom(state){
  const ghost=document.createElement('div');
  ghost.className='ghost-number';
  ghost.textContent=state.text;
  Object.assign(ghost.style,{
    left:`${state.rect.left}px`,top:`${state.rect.top}px`,width:`${state.rect.width}px`,height:`${state.rect.height}px`,lineHeight:`${state.rect.height}px`,fontSize:state.fontSize
  });
  document.body.appendChild(ghost);
  return ghost;
}

function finished(animation){return animation.finished.catch(()=>undefined)}
function nextFrame(){return new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))}

function animateLabels(){
  const animations=[];
  stackEl.querySelectorAll('.stack-label').forEach(label=>{
    if(label.textContent)animations.push(finished(label.animate([{opacity:.25},{opacity:1}],{duration:500,delay:250,easing:'ease-out'})));
  });
  return animations;
}

async function transition(mutator,options={}){
  const before=captureStack();
  if(options.extraBefore)for(const[id,state]of options.extraBefore)before.set(String(id),state);
  mutator();
  render();
  await nextFrame();

  const after=captureStack();
  const animations=[];
  const changed=new Set((options.changedIds||[]).map(String));
  const removedTo=options.removedTo||{};

  for(const[id,newState]of after){
    const el=stackEl.querySelector(`.stack-value[data-item-id="${id}"]`);
    const oldState=before.get(id);
    if(oldState){
      const dx=oldState.rect.left-newState.rect.left;
      const dy=oldState.rect.top-newState.rect.top;
      const valueChanged=changed.has(id)||oldState.text!==newState.text;
      if(valueChanged){
        const ghost=ghostFrom(oldState);
        animations.push(finished(ghost.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.82)'}],{duration:MOVE_MS*.7,easing:'ease-out',fill:'forwards'})).then(()=>ghost.remove()));
      }
      animations.push(finished(el.animate([
        {transform:`translate(${dx}px, ${dy}px) scale(${valueChanged?.86:1})`,opacity:valueChanged?.15:1},
        {transform:'translate(0,0) scale(1.04)',opacity:1,offset:.82},
        {transform:'translate(0,0) scale(1)',opacity:1}
      ],{duration:MOVE_MS,easing:EASE})));
    }else{
      animations.push(finished(el.animate([{opacity:0,transform:'scale(.7)'},{opacity:1,transform:'scale(1.06)',offset:.78},{opacity:1,transform:'scale(1)'}],{duration:MOVE_MS,easing:EASE})));
    }
  }

  for(const[id,oldState]of before){
    if(after.has(id))continue;
    const ghost=ghostFrom(oldState);
    const targetId=removedTo[id];
    const target=targetId?after.get(String(targetId)):null;
    let dx=0,dy=-oldState.rect.height*.7;
    if(target){dx=target.rect.left-oldState.rect.left;dy=target.rect.top-oldState.rect.top}
    animations.push(finished(ghost.animate([
      {opacity:1,transform:'translate(0,0) scale(1)'},
      {opacity:target?.2:0,transform:`translate(${dx}px, ${dy}px) scale(${target?.72:.82})`}
    ],{duration:MOVE_MS,easing:EASE,fill:'forwards'})).then(()=>ghost.remove()));
  }

  animations.push(...animateLabels());
  await Promise.allSettled(animations);
}

function pushItem(item){stack.unshift(item);if(stack.length>MAX_STACK)stack.length=MAX_STACK}
function pulseEntry(){entryValueEl.animate([{transform:'scale(1)'},{transform:'scale(1.06)',offset:.45},{transform:'scale(1)'}],{duration:680,easing:'ease-out'})}
async function shake(el=entryFieldEl){await finished(el.animate([{transform:'translateX(0)'},{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(-4px)'},{transform:'translateX(0)'}],{duration:500,easing:'ease-out'}))}

function beginDigit(digit){
  if(!entering){entry='';entering=true}
  if(entry==='0'&&digit!=='0')entry=digit;
  else if(entry==='-0'&&digit!=='0')entry='-'+digit;
  else if(!(entry==='0'&&digit==='0')&&!(entry==='-0'&&digit==='0'))entry+=digit;
  setStatus();render();pulseEntry();
}

function decimal(){
  if(!entering){entry='0.';entering=true}
  else if(!entry.includes('.'))entry+=entry==='-'?'0.':'.';
  setStatus();render();pulseEntry();
}

async function toggleSign(){
  if(entering){entry=entry.startsWith('-')?entry.slice(1):'-'+entry;setStatus();render();pulseEntry();return}
  if(stack.length){const id=stack[0].id;await transition(()=>{stack[0]={...stack[0],value:-stack[0].value}},{changedIds:[id]});setStatus();return}
  entry='-';entering=true;setStatus();render();pulseEntry();
}

function backspace(){
  if(!entering)return;
  entry=entry.slice(0,-1);
  if(!entry)entering=false;
  setStatus();render();pulseEntry();
}

async function commitEntryAnimated(){
  if(!entering)return false;
  const value=parsedEntry();
  if(value===null){setStatus('Некорректное число');await shake();return false}
  const item=newItem(value);
  const source=captureElement(entryValueEl,entry);
  await transition(()=>{pushItem(item);entry='';entering=false},{extraBefore:new Map([[item.id,source]])});
  setStatus();return true;
}

async function enter(){
  if(entering){await commitEntryAnimated();return}
  if(!stack.length){setStatus('Сначала введите число');await shake();return}
  const sourceEl=stackEl.querySelector(`.stack-value[data-item-id="${stack[0].id}"]`);
  const duplicate=newItem(stack[0].value);
  const source=captureElement(sourceEl,formatNumber(stack[0].value));
  await transition(()=>pushItem(duplicate),{extraBefore:new Map([[duplicate.id,source]])});
  setStatus();
}

async function binary(op){
  if(entering&&!(await commitEntryAnimated()))return;
  if(stack.length<2){setStatus('Недостаточно элементов');await shake(stackEl);return}
  const x=stack[0],y=stack[1];
  let result;
  if(op==='+')result=y.value+x.value;
  if(op==='-')result=y.value-x.value;
  if(op==='*')result=y.value*x.value;
  if(op==='/'){
    if(x.value===0){setStatus('Деление на ноль');await shake(stackEl);return}
    result=y.value/x.value;
  }
  if(!Number.isFinite(result)){setStatus('Результат вне диапазона');await shake(stackEl);return}
  const resultId=y.id;
  await transition(()=>{stack.splice(0,2,{id:resultId,value:result})},{changedIds:[resultId],removedTo:{[x.id]:resultId}});
  setStatus();
}

async function unary(kind){
  if(entering&&!(await commitEntryAnimated()))return;
  if(!stack.length){setStatus('Стек пуст');await shake(stackEl);return}
  const x=stack[0];
  let result;
  switch(kind){
    case'reciprocal':if(x.value===0){setStatus('Деление на ноль');await shake(stackEl);return}result=1/x.value;break;
    case'square':result=x.value*x.value;break;
    case'cube':result=x.value*x.value*x.value;break;
    case'sqrt':if(x.value<0){setStatus('Квадратный корень отрицательного числа');await shake(stackEl);return}result=Math.sqrt(x.value);break;
    case'cbrt':result=Math.cbrt(x.value);break;
    default:return;
  }
  if(!Number.isFinite(result)){setStatus('Результат вне диапазона');await shake(stackEl);return}
  await transition(()=>{stack[0]={...stack[0],value:result}},{changedIds:[x.id]});
  setStatus();
}

async function drop(){
  if(entering){
    await finished(entryValueEl.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-18px) scale(.85)'}],{duration:600,easing:'ease-in',fill:'forwards'}));
    entry='';entering=false;render();setStatus();return;
  }
  if(stack.length)await transition(()=>stack.shift());
  setStatus();
}

async function swap(){
  if(entering&&!(await commitEntryAnimated()))return;
  if(stack.length<2){setStatus('Недостаточно элементов');await shake(stackEl);return}
  await transition(()=>{[stack[0],stack[1]]=[stack[1],stack[0]]});
  setStatus();
}

async function rollDown(){
  if(entering&&!(await commitEntryAnimated()))return;
  if(stack.length<2){setStatus('Недостаточно элементов');await shake(stackEl);return}
  await transition(()=>stack.push(stack.shift()));
  setStatus();
}

async function clearAll(){
  if(entering){entry='';entering=false;render()}
  if(stack.length)await transition(()=>{stack=[]});
  setStatus();
}

async function runAction(action){
  if(busy)return;
  setBusy(true);
  try{await action()}finally{setBusy(false)}
}

function handleImmediateButton(button){
  if(button.dataset.digit!==undefined){beginDigit(button.dataset.digit);return true}
  if(button.dataset.action==='decimal'){decimal();return true}
  if(button.dataset.action==='backspace'){backspace();return true}
  if(button.dataset.action==='sign'&&(entering||!stack.length)){toggleSign();return true}
  return false;
}

const TRAIN_OPS=[
  {key:'+',display:'+'},
  {key:'-',display:'−'},
  {key:'*',display:'×'},
  {key:'/',display:'÷'}
];

function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}

function makeExercise(){
  const a=randomInt(2,9),b=randomInt(2,9),c=randomInt(2,9);
  const op1=TRAIN_OPS[randomInt(0,TRAIN_OPS.length-1)];
  const op2=TRAIN_OPS[randomInt(0,TRAIN_OPS.length-1)];
  const shape=randomInt(0,1);
  if(shape===0){
    return{alg:`(${a} ${op1.display} ${b}) ${op2.display} ${c}`,rpn:`${a} ${b} ${op1.key} ${c} ${op2.key}`};
  }
  return{alg:`${a} ${op1.display} (${b} ${op2.display} ${c})`,rpn:`${a} ${b} ${c} ${op2.key} ${op1.key}`};
}

function normalizeOperators(text){return text.replace(/[×xX]/g,'*').replace(/[÷:]/g,'/').replace(/−/g,'-')}
function normalizeRpn(text){return normalizeOperators(text).trim().replace(/([+\-*/])/g,' $1 ').replace(/\s+/g,' ').trim()}

function infixToRpn(text){
  const normalized=normalizeOperators(text).replace(/\s+/g,'');
  if(!normalized)return null;
  const tokens=normalized.match(/\d+(?:\.\d+)?|[()+\-*/]/g);
  if(!tokens||tokens.join('')!==normalized)return null;
  const output=[];
  const ops=[];
  const precedence={'+':1,'-':1,'*':2,'/':2};
  let expectingValue=true;

  for(const token of tokens){
    if(/^\d/.test(token)){
      if(!expectingValue)return null;
      output.push(token);
      expectingValue=false;
    }else if(token==='('){
      if(!expectingValue)return null;
      ops.push(token);
    }else if(token===')'){
      if(expectingValue)return null;
      let found=false;
      while(ops.length){
        const op=ops.pop();
        if(op==='('){found=true;break}
        output.push(op);
      }
      if(!found)return null;
      expectingValue=false;
    }else{
      if(expectingValue)return null;
      while(ops.length&&ops[ops.length-1]!=='('&&precedence[ops[ops.length-1]]>=precedence[token])output.push(ops.pop());
      ops.push(token);
      expectingValue=true;
    }
  }

  if(expectingValue)return null;
  while(ops.length){
    const op=ops.pop();
    if(op==='(')return null;
    output.push(op);
  }
  return normalizeRpn(output.join(' '));
}

function clearExerciseState(){
  rpnExerciseFieldEl.classList.remove('target','correct','wrong');
  algExerciseFieldEl.classList.remove('target','correct','wrong');
}

function cancelNextExercise(){
  if(nextExerciseTimer){clearTimeout(nextExerciseTimer);nextExerciseTimer=null}
}

function targetField(){return currentExercise?.direction==='algToRpn'?rpnExerciseEl:algExerciseEl}
function targetContainer(){return currentExercise?.direction==='algToRpn'?rpnExerciseFieldEl:algExerciseFieldEl}

function focusTrainingTarget(){
  if(appMode!=='train'||trainingMode!=='auto'||!currentExercise)return;
  const field=targetField();
  field.focus();
  field.select();
}

function configureExerciseFields(){
  clearExerciseState();
  if(trainingMode==='manual'){
    rpnExerciseEl.readOnly=false;
    algExerciseEl.readOnly=false;
    rpnExerciseEl.tabIndex=0;
    algExerciseEl.tabIndex=0;
    return;
  }

  if(!currentExercise)return;
  const algToRpn=currentExercise.direction==='algToRpn';
  rpnExerciseEl.readOnly=!algToRpn;
  algExerciseEl.readOnly=algToRpn;
  rpnExerciseEl.tabIndex=algToRpn?0:-1;
  algExerciseEl.tabIndex=algToRpn?-1:0;
  targetContainer().classList.add('target');
}

function newExercise(){
  cancelNextExercise();
  if(trainingMode!=='auto')return;
  const exercise=makeExercise();
  currentExercise={...exercise,direction:nextDirection};
  nextDirection=nextDirection==='algToRpn'?'rpnToAlg':'algToRpn';

  if(currentExercise.direction==='algToRpn'){
    algExerciseEl.value=currentExercise.alg;
    rpnExerciseEl.value='';
  }else{
    rpnExerciseEl.value=currentExercise.rpn;
    algExerciseEl.value='';
  }
  configureExerciseFields();
  setStatus('');
  requestAnimationFrame(focusTrainingTarget);
}

async function markWrong(){
  const container=targetContainer();
  clearExerciseState();
  container.classList.add('wrong');
  setStatus('Попробуйте ещё');
  await finished(container.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:300,easing:'ease-out'}));
  container.classList.add('target');
  focusTrainingTarget();
}

async function checkExercise(){
  if(trainingMode!=='auto'||!currentExercise)return;
  const expected=normalizeRpn(currentExercise.rpn);
  let correct=false;

  if(currentExercise.direction==='algToRpn'){
    correct=normalizeRpn(rpnExerciseEl.value)===expected;
  }else{
    const converted=infixToRpn(algExerciseEl.value);
    correct=converted===expected;
  }

  if(!correct){await markWrong();return}

  clearExerciseState();
  const container=targetContainer();
  container.classList.add('correct');
  if(currentExercise.direction==='algToRpn')rpnExerciseEl.value=expected;
  else algExerciseEl.value=currentExercise.alg;
  setStatus('Верно');
  nextExerciseTimer=setTimeout(newExercise,1200);
}

async function checkManualExercise(){
  cancelNextExercise();
  clearExerciseState();

  const rpn=normalizeRpn(rpnExerciseEl.value);
  const algAsRpn=infixToRpn(algExerciseEl.value);

  let invalid=false;
  if(!rpn){
    rpnExerciseFieldEl.classList.add('wrong');
    invalid=true;
  }
  if(!algAsRpn){
    algExerciseFieldEl.classList.add('wrong');
    invalid=true;
  }

  if(invalid){
    setStatus('Заполните обе корректные записи');
    return;
  }

  if(rpn===algAsRpn){
    rpnExerciseFieldEl.classList.add('correct');
    algExerciseFieldEl.classList.add('correct');
    setStatus('Верно');
    return;
  }

  rpnExerciseFieldEl.classList.add('wrong');
  algExerciseFieldEl.classList.add('wrong');
  setStatus('Записи не эквивалентны');
  await Promise.all([
    finished(rpnExerciseFieldEl.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:280,easing:'ease-out'})),
    finished(algExerciseFieldEl.animate([{transform:'translateX(0)'},{transform:'translateX(5px)'},{transform:'translateX(-5px)'},{transform:'translateX(0)'}],{duration:280,easing:'ease-out'}))
  ]);
}

function setAppMode(mode){
  appMode=mode;
  appEl.classList.toggle('calc-mode',mode==='calc');
  appEl.classList.toggle('train-mode',mode==='train');
  appModeButtons.forEach(button=>button.classList.toggle('active',button.dataset.appMode===mode));
  if(mode==='calc'){
    cancelNextExercise();
    if(document.activeElement===rpnExerciseEl||document.activeElement===algExerciseEl)document.activeElement.blur();
  }else if(trainingMode==='auto'){
    if(!currentExercise)newExercise();
    else{configureExerciseFields();requestAnimationFrame(focusTrainingTarget)}
  }
}

function setTrainingMode(mode){
  trainingMode=mode;
  trainingModeButtons.forEach(button=>button.classList.toggle('active',button.dataset.trainingMode===mode));
  cancelNextExercise();

  if(mode==='manual'){
    currentExercise=null;
    clearExerciseState();
    rpnExerciseEl.readOnly=false;
    algExerciseEl.readOnly=false;
    rpnExerciseEl.tabIndex=0;
    algExerciseEl.tabIndex=0;
    setStatus('');
  }else{
    newExercise();
  }
}

appModeButtons.forEach(button=>button.addEventListener('click',()=>setAppMode(button.dataset.appMode)));
trainingModeButtons.forEach(button=>button.addEventListener('click',()=>setTrainingMode(button.dataset.trainingMode)));

document.querySelector('.keys').addEventListener('click',event=>{
  const button=event.target.closest('button');
  if(!button)return;
  if(!busy&&handleImmediateButton(button))return;
  if(busy)return;
  runAction(async()=>{
    if(button.dataset.binary)await binary(button.dataset.binary);
    else if(button.dataset.unary)await unary(button.dataset.unary);
    else switch(button.dataset.action){
      case'sign':await toggleSign();break;
      case'enter':await enter();break;
      case'drop':await drop();break;
      case'swap':await swap();break;
      case'roll':await rollDown();break;
      case'clear':await clearAll();break;
    }
  });
});

rpnExerciseEl.addEventListener('input',()=>{
  if(trainingMode==='auto'&&currentExercise?.direction==='algToRpn'){
    rpnExerciseFieldEl.classList.remove('wrong','correct');
    rpnExerciseFieldEl.classList.add('target');
  }else if(trainingMode==='manual'){
    clearExerciseState();
  }
  setStatus('');
});

algExerciseEl.addEventListener('input',()=>{
  if(trainingMode==='auto'&&currentExercise?.direction==='rpnToAlg'){
    algExerciseFieldEl.classList.remove('wrong','correct');
    algExerciseFieldEl.classList.add('target');
  }else if(trainingMode==='manual'){
    clearExerciseState();
  }
  setStatus('');
});

function exerciseKeydown(event){
  if(event.key==='Enter'){
    event.preventDefault();
    if(trainingMode==='auto')checkExercise();
    else checkManualExercise();
  }else if(event.key==='Escape'){
    event.preventDefault();
    if(trainingMode==='auto')newExercise();
    else{
      clearExerciseState();
      setStatus('');
    }
  }
}

rpnExerciseEl.addEventListener('keydown',exerciseKeydown);
algExerciseEl.addEventListener('keydown',exerciseKeydown);

window.addEventListener('keydown',event=>{
  if(event.target instanceof HTMLInputElement&&event.target.classList.contains('exercise-input'))return;
  if(!busy&&/^[0-9]$/.test(event.key)){event.preventDefault();beginDigit(event.key);return}
  if(!busy&&(event.key==='.'||event.key===',')){event.preventDefault();decimal();return}
  if(!busy&&event.key==='Backspace'){event.preventDefault();backspace();return}
  if(!busy&&event.key==='-'&&(entering||!stack.length)){event.preventDefault();toggleSign();return}
  if(busy)return;
  let action=null;
  if(event.key==='Enter')action=enter;
  else if(['+','-','*','/'].includes(event.key))action=()=>binary(event.key);
  else if(event.key==='Escape')action=clearAll;
  if(action){event.preventDefault();runAction(action)}
});

window.rpnTrainingFields={
  set(rpn='',alg=''){
    setTrainingMode('manual');
    rpnExerciseEl.value=rpn;
    algExerciseEl.value=alg;
  },
  clear(){rpnExerciseEl.value='';algExerciseEl.value='';clearExerciseState()},
  values(){return{rpn:rpnExerciseEl.value,alg:algExerciseEl.value}},
  next(){setTrainingMode('auto');newExercise()},
  answer(){return currentExercise?{rpn:currentExercise.rpn,alg:currentExercise.alg,direction:currentExercise.direction}:null},
  check(){return trainingMode==='manual'?checkManualExercise():checkExercise()}
};

setAppMode('train');
setTrainingMode('auto');
render();
})();
</script>
