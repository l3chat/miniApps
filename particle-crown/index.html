<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rotating Particle Crown — Three.js</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,100);
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const crown = new THREE.Group();
scene.add(crown);

const DPR = () => Math.min(devicePixelRatio, 2);

let seed = 0x2f6e2b1;
function rnd(){
  seed ^= seed << 13;
  seed ^= seed >>> 17;
  seed ^= seed << 5;
  return ((seed >>> 0) / 4294967296);
}
function signed(){ return rnd() * 2 - 1; }

function makeGeometry(points, sizes){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
  g.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));
  return g;
}

function makeParticleMaterial(color, opacity = 1.0){
  return new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    depthTest: true,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uColor: { value: new THREE.Color(color) },
      uOpacity: { value: opacity },
      uPixelRatio: { value: DPR() },
      uPointScale: { value: 3.3 }
    },
    vertexShader: `
      uniform float uPixelRatio;
      uniform float uPointScale;
      attribute float aSize;
      varying float vAlpha;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * uPixelRatio * uPointScale;
        vAlpha = 1.0;
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      uniform float uOpacity;
      varying float vAlpha;
      void main(){
        vec2 p = gl_PointCoord - vec2(0.5);
        float d = length(p);
        if(d > 0.5) discard;
        float core = smoothstep(0.48, 0.05, d);
        float halo = smoothstep(0.50, 0.20, d);
        float alpha = (0.70 * core + 0.30 * halo) * uOpacity * vAlpha;
        vec3 c = uColor * (0.82 + 0.40 * core);
        gl_FragColor = vec4(c, alpha);
      }
    `
  });
}

const goldPos = [];
const goldSize = [];
const TORUS_R = 2.15;
const TORUS_r = 0.42;
const GOLD_COUNT = innerWidth < 700 ? 1250 : 1850;

for(let i = 0; i < GOLD_COUNT; i++){
  const a = rnd() * Math.PI * 2;
  const b = rnd() * Math.PI * 2;
  const rr = TORUS_r * (0.80 + 0.28 * rnd());
  const R = TORUS_R + rr * Math.cos(b);

  goldPos.push(
    R * Math.cos(a) + signed() * 0.025,
    rr * Math.sin(b) - 0.05 + signed() * 0.025,
    R * Math.sin(a) + signed() * 0.025
  );
  goldSize.push(1.05 + rnd() * 0.70);
}

const gold = new THREE.Points(
  makeGeometry(goldPos, goldSize),
  makeParticleMaterial(0xffd84a, 0.96)
);
crown.add(gold);

const teethRoot = new THREE.Group();
const symbolRoot = new THREE.Group();
crown.add(teethRoot, symbolRoot);

const TOOTH_COUNT = 8;
const toothColors = [0xff365f, 0x356cff];
const symbolChars = ['✦','✧','✶','✹','✦','✧','✶','✹'];

function makeTextTexture(char, color){
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,256,256);
  const grad = ctx.createRadialGradient(128,128,6,128,128,118);
  grad.addColorStop(0,'rgba(255,255,255,0.92)');
  grad.addColorStop(0.22,'rgba(255,245,210,0.75)');
  grad.addColorStop(0.58,'rgba(255,245,210,0.18)');
  grad.addColorStop(1,'rgba(255,245,210,0.00)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(128,128,118,0,Math.PI*2);
  ctx.fill();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 118px "Segoe UI Symbol", "Noto Sans Symbols", sans-serif';
  ctx.fillStyle = color;
  ctx.shadowColor = 'rgba(255,255,255,0.50)';
  ctx.shadowBlur = 22;
  ctx.fillText(char,128,128);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function addTooth(index){
  const theta = index * Math.PI * 2 / TOOTH_COUNT + 0.15;
  const radial = new THREE.Vector3(Math.cos(theta), 0, Math.sin(theta));
  const tangent = new THREE.Vector3(-Math.sin(theta), 0, Math.cos(theta));
  const up = new THREE.Vector3(0,1,0);

  const baseRadius = 1.92;
  const baseY = 0.38;
  const apexRadius = 2.05;
  const apexY = 5.72;
  const baseHalfWidth = 0.38;

  const left = radial.clone().multiplyScalar(baseRadius).addScaledVector(tangent, -baseHalfWidth).setY(baseY);
  const right = radial.clone().multiplyScalar(baseRadius).addScaledVector(tangent, baseHalfWidth).setY(baseY);
  const apex = radial.clone().multiplyScalar(apexRadius).setY(apexY);

  const pts = [];
  const sizes = [];
  const count = 320;
  for(let i=0;i<count;i++){
    let u = rnd(), v = rnd();
    if(u + v > 1){ u = 1 - u; v = 1 - v; }
    const w = 1 - u - v;
    const p = new THREE.Vector3(
      left.x * w + right.x * u + apex.x * v,
      left.y * w + right.y * u + apex.y * v,
      left.z * w + right.z * u + apex.z * v
    );
    p.addScaledVector(radial, signed() * 0.004);
    pts.push(p.x, p.y, p.z);
    sizes.push(0.68 + rnd() * 0.70);
  }

  const edges = [[left,right],[right,apex],[apex,left]];
  for(const [a,b] of edges){
    for(let i=0;i<70;i++){
      const t = i / 69;
      const p = new THREE.Vector3().lerpVectors(a,b,t);
      p.addScaledVector(radial, signed() * 0.004);
      pts.push(p.x, p.y, p.z);
      sizes.push(0.92 + rnd() * 0.78);
    }
  }

  const tooth = new THREE.Points(
    makeGeometry(pts, sizes),
    makeParticleMaterial(toothColors[index % 2], 0.98)
  );
  teethRoot.add(tooth);

  const tex = makeTextTexture(symbolChars[index % symbolChars.length], '#fff3c9');
  const mat = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    opacity: 0.98
  });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(0.82, 0.82), mat);
  plane.position.copy(apex).addScaledVector(up, 0.42).addScaledVector(radial, 0.03);
  plane.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(tangent, up, radial));
  symbolRoot.add(plane);
}

for(let i=0;i<TOOTH_COUNT;i++) addTooth(i);

const sparklePos = [];
const sparkleSize = [];
for(let i=0;i<140;i++){
  const a = rnd() * Math.PI * 2;
  const r = 1.8 + rnd() * 0.9;
  sparklePos.push(Math.cos(a)*r, 4.5 + rnd()*1.7, Math.sin(a)*r);
  sparkleSize.push(0.72 + rnd() * 0.8);
}
const sparkles = new THREE.Points(
  makeGeometry(sparklePos, sparkleSize),
  makeParticleMaterial(0xfff5d6, 0.86)
);
crown.add(sparkles);
crown.rotation.z = 0.015;

const ROTATION_SPEED = 0.42;
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  crown.rotation.y += ROTATION_SPEED * dt;
  renderer.render(scene, camera);
}
animate();

function fit(){
  const aspect = innerWidth / innerHeight;
  const frustumH = aspect < 0.72 ? 10.9 : 9.8;
  const frustumW = frustumH * aspect;
  camera.left = -frustumW / 2;
  camera.right = frustumW / 2;
  camera.top = frustumH / 2;
  camera.bottom = -frustumH / 2;
  camera.position.set(0, 3.65, 12.5);
  camera.lookAt(0, 2.45, 0);
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(DPR());
  renderer.setSize(innerWidth, innerHeight);

  const pointScale = aspect < 0.72 ? 3.5 : 3.1;
  [gold, sparkles, ...teethRoot.children].forEach(obj => {
    obj.material.uniforms.uPixelRatio.value = DPR();
    obj.material.uniforms.uPointScale.value = pointScale;
  });
}

addEventListener('resize', fit);
fit();
</script>
</body>
</html>
