<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Monocular Motion Parallax Lab</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <main class="pageShell">
    <section class="viewer" id="viewer" aria-label="3D scene">
      <div id="app"></div>
      <div class="topbar">
        <div class="brand">Monocular Motion Parallax <small><span id="brandDemo">Three.js demo</span> · <span id="versionText"></span> · <span id="screenText"></span></small></div>
        <div class="hud"><span id="fps">— fps</span> · x=<span id="camx">0.0</span> cm · F=<span id="focusHud">8.0</span> m · <span id="modeText">Static</span></div>
      </div>
      <div class="legend" id="legendText"></div>
    </section>

    <aside class="sidePanel">
      <div class="controls">
        <div class="languageRow">
          <label for="languageSelect" id="languageLabel">Язык / Language</label>
          <select id="languageSelect" aria-label="Language">
            <option value="ru">Русский</option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="uk">Українська</option>
            <option value="fr">Français</option>
          </select>
        </div>

        <div class="sectionTitle" id="motionTitle"></div>
        <div class="segmented" id="modeButtons">
          <button data-mode="static" class="active" id="modeStatic"></button>
          <button data-mode="lr" id="modeLR">L ↔ R</button>
          <button data-mode="five" id="modeFive"></button>
          <button data-mode="continuous" id="modeContinuous"></button>
        </div>

        <div class="row"><label for="baseline" id="baselineLabel"></label><input id="baseline" type="range" min="0" max="30" step="0.5" value="8"><div class="value"><span id="baselineVal">8.0</span> cm</div></div>
        <div class="row"><label for="frequency" id="frequencyLabel"></label><input id="frequency" type="range" min="0.1" max="8" step="0.1" value="1.6"><div class="value"><span id="frequencyVal">1.6</span> Hz</div></div>
        <div class="row"><label for="focusDistance" id="focusDistanceLabel"></label><input id="focusDistance" type="range" min="0.2" max="15" step="0.1" value="8"><div class="value"><span id="focusDistanceVal">8.0</span> m</div></div>
        <div class="row"><label for="waveform" id="waveformLabel"></label><select id="waveform"><option value="sine">Sine</option><option value="triangle">Triangle</option></select><div class="value"></div></div>
        <div class="row"><label for="fov" id="fovLabel"></label><input id="fov" type="range" min="35" max="80" step="1" value="55"><div class="value"><span id="fovVal">55</span>°</div></div>
        <div class="row"><label for="sceneDepth" id="sceneDepthLabel"></label><input id="sceneDepth" type="range" min="0.5" max="4" step="0.1" value="2.4"><div class="value"><span id="sceneDepthVal">2.4</span> m</div></div>

        <div class="grid2">
          <button id="pauseBtn" class="secondary"></button>
          <button id="fullscreenBtn" class="secondary"></button>
          <button id="hideControlsBtn" class="secondary"></button>
          <button id="resetBtn" class="secondary"></button>
          <button id="trainingBtn" class="good"></button>
          <button id="experimentBtn" class="secondary"></button>
        </div>

        <div id="gameStatus" class="gameStatus" hidden>
          <span id="gameScoreLabel"></span>: <strong id="gameScore">—</strong>
          <span id="unresolvedStatus"></span>
        </div>

        <div id="experimentPanel" class="experimentPanel" hidden>
          <div id="experimentStatus" class="gameStatus"></div>
          <button id="uncertainBtn" class="secondary wide"></button>
        </div>

        <details id="gameHelp" class="gameHelp">
          <summary id="gameRulesTitle"></summary>
          <div id="gameRulesText"></div>
        </details>

        <button id="sceneBtn" class="secondary wide"></button>
        <div class="hint" id="hintText"></div>
      </div>

      <button id="panelToggle" class="panelToggle" aria-label="Show controls">☰</button>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
