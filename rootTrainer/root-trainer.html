if(ans===null||locked)return;locked=true;started=0;total++;streak=0;e.answer.classList.remove('focus');tgHaptic('warning');feedback(tr('timeout',{answer:ans}),'time');addHistory('time',null,limit);stats();later(1400)}function capacity(){const w=innerWidth,h=innerHeight;if(w>h)return h<420?3:h<600?5:7;return h<560?2:h<700?3:h<900?4:h<1100?5:6}function updateCapacity(){const n=capacity();if(n===hcap&&e.history.children.length)return;hcap=n;document.documentElement.style.setProperty('--hr',n);renderHistory()}function addHistory(status,user,x){hdata.unshift({status,user,x,deg,rad,ans,revealed:status!=='bad',corrected:false});hdata=hdata.slice(0,20);renderHistory()}function renderHistory(){e.history.replaceChildren();hdata.slice(0,hcap).forEach(h=>{const item=document.createElement('div'),left=document.createElement('span'),badge=document.createElement('span');item.className='hitem';left.className='hexpr';left.textContent=(h.deg===2?'√':'∛')+String(h.rad)+(h.status==='bad'?` — ${tr('you')}: ${h.user}`+(h.revealed?`, ${tr('ans')}: ${h.ans}`:''):'');badge.className='hbadge '+h.status;badge.textContent=(h.corrected?tr('histCorrected'):h.status==='good'?tr('histCorrect'):h.status==='bad'?tr('histError'):tr('histTime'))+` ${h.x.toFixed(1)}${tr('sec')}`;item.append(left,badge);e.history.append(item)});for(let i=Math.min(hdata.length,hcap);i<hcap;i++){const item=document.createElement('div');item.className='hitem empty';item.innerHTML='&nbsp;';item.setAttribute('aria-hidden','true');e.history.append(item)}}function stats(){$('score').textContent=score;$('streak').textContent=streak;$('acc').textContent=total?Math.round(correct/total*100)+'%':'—';$('avg').textContent=times.length?(times.reduce((a,b)=>a+b,0)/times.length).toFixed(1)+tr('sec'):'—'}function reset(){score=streak=total=correct=0;times=[];hdata=[];correction=false;wrongAt=null;e.actions.classList.remove('show');stats();updateCapacity();renderHistory()}document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>applyLa
