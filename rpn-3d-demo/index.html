<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RPN 3D Demo</title>
<style>
  :root{
    --bg:#eaf4f7;--panel:rgba(255,255,255,.88);--ink:#17323a;--muted:#6b7f85;
    --accent:#2f9d7e;--accent2:#b87500;--danger:#d65353;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .hud{position:fixed;inset:0;pointer-events:none;color:var(--ink)}
  .top{
    position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    display:flex;gap:7px;align-items:center;padding:6px;border-radius:14px;background:var(--panel);
    backdrop-filter:blur(8px);pointer-events:auto;box-shadow:0 8px 30px rgba(55,92,103,.16)
  }
  button{
    border:0;border-radius:9px;padding:9px 13px;background:#dcebee;color:var(--ink);
    font:800 14px/1 system-ui;cursor:pointer;touch-action:manipulation
  }
  button.primary{background:#2f9d7e;color:#fff}
  button:disabled{opacity:.45}
  .speed{display:flex;align-items:center;gap:6px;padding:0 5px;color:var(--muted);font-size:12px;font-weight:800}
  .speed input{width:90px;accent-color:var(--accent)}
  .lesson{
    position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);
    width:min(92vw,760px);padding:11px 16px;border-radius:14px;background:var(--panel);
    backdrop-filter:blur(8px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)
  }
  .lesson strong{display:block;color:var(--accent2);font-size:clamp(16px,3.5vw,22px);margin-bottom:3px}
  .lesson span{display:block;color:var(--ink);font-size:clamp(13px,2.8vw,17px);line-height:1.25}
  .legend{
    position:absolute;left:max(8px,env(safe-area-inset-left));top:64px;padding:9px 11px;border-radius:12px;
    background:rgba(255,255,255,.78);font-size:12px;line-height:1.45;color:var(--muted)
  }
  .legend b{color:var(--ink)}
  .bubble{
    position:absolute;display:none;max-width:230px;padding:8px 11px;border-radius:14px;
    background:#fff;color:#17211c;font-weight:850;font-size:13px;line-height:1.2;
    box-shadow:0 8px 22px rgba(55,92,103,.18);opacity:1;transition:opacity .18s linear
  }
  .bubble::after{
    content:"";position:absolute;left:28px;bottom:-9px;border:10px solid transparent;border-top-color:#fff;border-bottom:0
  }
  .bubble.calc::after{left:auto;right:28px}
  @media(max-width:620px){
    .top{top:max(5px,env(safe-area-inset-top));gap:4px;padding:4px}
    button{padding:8px 9px;font-size:12px}
    .speed{display:none}
    .legend{top:52px;font-size:10px;padding:6px 8px}
  }
</style>
</head>
<body>
<div class="hud">
  <div class="top">
    <button id="play" class="primary">▶ Play</button>
    <button id="step">Step</button>
    <button id="reset">↺ Reset</button>
    <div class="speed"><span>Speed</span><input id="speed" type="range" min="0.45" max="2.2" step="0.05" value="1"></div>
  </div>
  <div class="legend"><b>Поток:</b> 3 · 4 · + · 5 · ×<br><b>Правило:</b> число → стек, операция → калькулятор</div>
  <div id="robotBubble" class="bubble"></div>
  <div id="calcBubble" class="bubble calc"></div>
  <div class="lesson"><strong id="title">Обратная польская запись как маленький спектакль</strong><span id="text">Нажмите Play или Step. Робот будет читать поток слева направо.</span></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xeaf4f7);
scene.fog=new THREE.Fog(0xeaf4f7,24,48);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);
camera.position.set(0,8.4,18);
camera.lookAt(0,2.3,0);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0xb8c9be,2.8));
const key=new THREE.DirectionalLight(0xffffff,3.2); key.position.set(-6,12,8); key.castShadow=true; scene.add(key);
const rim=new THREE.PointLight(0x79d7bd,12,22); rim.position.set(4,5,-3); scene.add(rim);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(32,18),new THREE.MeshStandardMaterial({color:0xd7e6df,roughness:.92,metalness:.02}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

function canvasTexture(text,bg='#ffffff',fg='#17211c',w=512,h=256,font=150){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  x.fillStyle=bg;x.fillRect(0,0,w,h);x.fillStyle=fg;x.font=`900 ${font}px system-ui`;
  x.textAlign='center';x.textBaseline='middle';x.fillText(text,w/2,h/2+4);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function labelSprite(text,{bg='#ffffff',fg='#17211c',scale=[2.4,1.2]}={}){
  const m=new THREE.SpriteMaterial({map:canvasTexture(text,bg,fg),transparent:true,depthTest:false});
  const s=new THREE.Sprite(m);s.scale.set(scale[0],scale[1],1);return s;
}
function boxToken(text,color=0xffd166){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.2,.72,.42),new THREE.MeshStandardMaterial({color,roughness:.35,metalness:.08}));
  body.castShadow=true;g.add(body);
  const lab=labelSprite(String(text),{bg:'#fff9e8',fg:'#15231d',scale:[.95,.48]});lab.position.z=.225;g.add(lab);
  g.userData.text=String(text);g.userData.isToken=true;return g;
}
function roundedPlatform(w,d,color){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,.18,d),new THREE.MeshStandardMaterial({color,roughness:.65,metalness:.05}));
  m.receiveShadow=true;m.castShadow=true;return m;
}

const conveyor=new THREE.Group();conveyor.position.set(-5.2,0,2.6);scene.add(conveyor);
const belt=roundedPlatform(8.2,2.0,0xb7cdd2);belt.position.y=.18;conveyor.add(belt);
for(let i=0;i<9;i++){const r=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,1.75,18),new THREE.MeshStandardMaterial({color:0x789aa2,metalness:.35,roughness:.45}));r.rotation.z=Math.PI/2;r.position.set(-3.6+i*.9,.32,0);conveyor.add(r)}
const sourceTokens=['3','4','+','5','×'].map((t,i)=>{const tok=boxToken(t,['+','×'].includes(t)?0xff8f70:0xffd166);tok.position.set(-3.1+i*1.35,.85,0);conveyor.add(tok);return tok;});

function makeRobot(){
  const g=new THREE.Group();
  const blue=new THREE.MeshStandardMaterial({color:0x4fb6d4,roughness:.28,metalness:.26});
  const blue2=new THREE.MeshStandardMaterial({color:0x79d8eb,roughness:.22,metalness:.18});
  const dark=new THREE.MeshStandardMaterial({color:0x132f38,roughness:.35,metalness:.35});
  const silver=new THREE.MeshStandardMaterial({color:0xa9c4cc,roughness:.25,metalness:.55});
  const glow=new THREE.MeshStandardMaterial({color:0x8dffcf,emissive:0x39c991,emissiveIntensity:2.4,roughness:.2});

  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.72,.82,8,18),blue);
  torso.scale.set(1.05,1.05,.72);torso.position.y=1.55;torso.castShadow=true;g.add(torso);

  const chest=new THREE.Mesh(new THREE.BoxGeometry(.72,.52,.12),dark);
  chest.position.set(0,1.58,.63);chest.castShadow=true;g.add(chest);
  const chestLight=new THREE.Mesh(new THREE.RingGeometry(.11,.18,24),new THREE.MeshBasicMaterial({color:0xffd166,side:THREE.DoubleSide}));
  chestLight.position.set(0,1.62,.702);g.add(chestLight);

  const neck=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.22,18),silver);
  neck.position.y=2.34;g.add(neck);

  const head=new THREE.Mesh(new THREE.SphereGeometry(.72,28,20),blue2);
  head.scale.set(1.0,.82,.82);head.position.y=2.82;head.castShadow=true;g.add(head);
  const face=new THREE.Mesh(new THREE.BoxGeometry(1.02,.43,.09),dark);
  face.position.set(0,2.80,.61);g.add(face);

  for(const x of[-.25,.25]){
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.105,18,18),glow);
    eye.position.set(x,2.82,.68);g.add(eye);
  }
  const mouth=new THREE.Mesh(new THREE.BoxGeometry(.28,.035,.035),silver);
  mouth.position.set(0,2.62,.675);g.add(mouth);

  const antenna=new THREE.Mesh(new THREE.CylinderGeometry(.035,.045,.44,12),silver);
  antenna.position.set(0,3.47,0);g.add(antenna);
  const antennaBall=new THREE.Mesh(new THREE.SphereGeometry(.11,18,18),new THREE.MeshStandardMaterial({color:0xffd166,emissive:0x8a5d00,emissiveIntensity:1.2}));
  antennaBall.position.set(0,3.72,0);g.add(antennaBall);

  const backpack=new THREE.Mesh(new THREE.BoxGeometry(.82,.95,.34),dark);
  backpack.position.set(0,1.62,-.68);backpack.castShadow=true;g.add(backpack);

  g.userData.armL=new THREE.Group();g.userData.armR=new THREE.Group();
  for(const [arm,x] of [[g.userData.armL,-.88],[g.userData.armR,.88]]){
    arm.position.set(x,2.05,0);
    const joint=new THREE.Mesh(new THREE.SphereGeometry(.18,16,16),silver);arm.add(joint);
    const upper=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.52,6,12),blue2);upper.position.y=-.38;arm.add(upper);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(.18,16,16),silver);hand.scale.set(1,.7,.65);hand.position.y=-.82;arm.add(hand);
    g.add(arm);
  }

  g.userData.legs=[];
  for(const x of[-.38,.38]){
    const leg=new THREE.Group();leg.position.set(x,.72,0);
    const hip=new THREE.Mesh(new THREE.SphereGeometry(.16,14,14),silver);leg.add(hip);
    const shin=new THREE.Mesh(new THREE.CapsuleGeometry(.15,.48,6,12),dark);shin.position.y=-.38;leg.add(shin);
    const foot=new THREE.Mesh(new THREE.BoxGeometry(.42,.20,.62),blue2);foot.position.set(0,-.78,.12);leg.add(foot);
    g.add(leg);g.userData.legs.push(leg);
  }

  const grip=new THREE.Object3D();grip.position.set(0,1.62,.92);g.add(grip);g.userData.grip=grip;
  g.userData.walking=false;
  return g;
}
const ROBOT_HOME=new THREE.Vector3(-8.9,0,.15);
const robot=makeRobot();robot.position.copy(ROBOT_HOME);scene.add(robot);

const stackGroup=new THREE.Group();stackGroup.position.set(2.4,0,-2.1);scene.add(stackGroup);
const stackBase=roundedPlatform(3.4,2.5,0x9fc9bb);stackBase.position.y=.15;stackGroup.add(stackBase);
const stackTitle=labelSprite('СТЕК',{bg:'#dff4eb',fg:'#246c58',scale:[2.5,.62]});stackTitle.position.set(0,6.15,.2);stackGroup.add(stackTitle);
const slots=[];
const stackSlotLabels=[];
for(let i=0;i<5;i++){
  const frame=new THREE.Mesh(new THREE.BoxGeometry(2.5,.88,.95),new THREE.MeshStandardMaterial({color:0x8fc6b7,transparent:true,opacity:.34,roughness:.5}));
  frame.position.set(0,.85+i,0);stackGroup.add(frame);slots.push(frame);

  const slotLabel=labelSprite('',{bg:'#e8f5f0',fg:'#246c58',scale:[.72,.34]});
  slotLabel.position.set(-.88,.85+i,.50);
  stackGroup.add(slotLabel);
  stackSlotLabels.push(slotLabel);
}

function makeCalculator(){
  const g=new THREE.Group();
  const coral=new THREE.MeshStandardMaterial({color:0xf07f61,roughness:.28,metalness:.14});
  const coral2=new THREE.MeshStandardMaterial({color:0xffa07f,roughness:.25,metalness:.10});
  const dark=new THREE.MeshStandardMaterial({color:0x152c34,roughness:.30,metalness:.38});
  const silver=new THREE.MeshStandardMaterial({color:0xb8c8cc,roughness:.22,metalness:.62});

  const body=new THREE.Mesh(new THREE.BoxGeometry(2.35,2.65,1.45),coral);
  body.position.y=1.62;body.castShadow=true;g.add(body);
  const top=new THREE.Mesh(new THREE.BoxGeometry(1.8,.30,1.10),coral2);
  top.position.set(0,3.06,0);top.castShadow=true;g.add(top);

  const screenFrame=new THREE.Mesh(new THREE.BoxGeometry(1.78,.92,.12),dark);
  screenFrame.position.set(0,2.12,.755);g.add(screenFrame);
  const screenLabel=labelSprite('готов',{bg:'#10252d',fg:'#a8ffd9',scale:[1.48,.58]});
  screenLabel.position.set(0,2.12,.83);g.add(screenLabel);g.userData.screen=screenLabel;

  const slot=new THREE.Mesh(new THREE.BoxGeometry(1.18,.18,.16),dark);
  slot.position.set(-.42,1.43,.79);g.add(slot);
  const slotLamp=new THREE.Mesh(new THREE.SphereGeometry(.07,14,14),new THREE.MeshStandardMaterial({color:0x8dffcf,emissive:0x36cc8e,emissiveIntensity:2}));
  slotLamp.position.set(.78,1.43,.85);g.add(slotLamp);

  const keyColors=[0xffd166,0x8dffcf,0x8eb8ff,0xffa07f];
  let k=0;
  for(const y of[1.02,.67]){
    for(const x of[-.62,-.20,.22,.64]){
      const b=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.10,18),new THREE.MeshStandardMaterial({color:keyColors[k++%keyColors.length],roughness:.25,metalness:.15}));
      b.rotation.x=Math.PI/2;b.position.set(x,y,.80);g.add(b);
    }
  }

  for(const x of[-.82,.82]){
    const side=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,1.05,16),silver);
    side.position.set(x,1.6,0);side.rotation.z=.10*x;g.add(side);
  }
  for(const x of[-.72,.72]){
    const foot=new THREE.Mesh(new THREE.BoxGeometry(.55,.24,.72),dark);
    foot.position.set(x,.18,.08);g.add(foot);
  }

  const topLight=new THREE.PointLight(0xff8f70,5,4);topLight.position.set(0,3.45,.3);g.add(topLight);
  const knob=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.18,18),silver);
  knob.rotation.x=Math.PI/2;knob.position.set(0,3.22,.55);g.add(knob);
  return g;
}
const calc=makeCalculator();calc.position.set(6.4,0,-2.25);scene.add(calc);

const stackTokens=[];
function stackPos(index){return new THREE.Vector3(2.4,.85+index,-1.55)}
function worldOf(obj){const v=new THREE.Vector3();obj.getWorldPosition(v);return v}
function setSpriteText(sprite,value){
  if(sprite.material.map)sprite.material.map.dispose();
  sprite.material.map=canvasTexture(value,'#e8f5f0','#246c58',512,256,120);
  sprite.material.needsUpdate=true;
}
function updateStackLabels(){
  const names=['X','Y','Z','T','U'];
  const count=stackTokens.length;
  for(let slot=0;slot<stackSlotLabels.length;slot++){
    const distanceBelowTop=(count-1)-slot;
    setSpriteText(
      stackSlotLabels[slot],
      slot<count && distanceBelowTop>=0 && distanceBelowTop<names.length ? names[distanceBelowTop] : ''
    );
  }
}
function faceViewer(obj){
  if(!obj?.userData?.isToken)return;
  const parent=obj.parent;
  if(!parent){obj.quaternion.copy(camera.quaternion);return}
  const invParent=new THREE.Quaternion();
  parent.getWorldQuaternion(invParent).invert();
  obj.quaternion.copy(invParent.multiply(camera.quaternion.clone()));
}

const title=document.getElementById('title'),text=document.getElementById('text'),rb=document.getElementById('robotBubble'),cb=document.getElementById('calcBubble');
function lesson(t,d){title.textContent=t;text.textContent=d}
let activeBubble=null;
let activeBubbleAnchor=null;
let lastBubbleShownAt=0;
function positionBubble(el,world){
  const p=world.clone().project(camera);
  el.style.left=((p.x*.5+.5)*innerWidth)+'px';
  el.style.top=((-p.y*.5+.5)*innerHeight-70)+'px';
}
async function bubble(el,msg,world,anchor=null){
  if(!msg)return;
  if(activeBubble&&activeBubble.style.display==='block'){
    activeBubble.style.opacity='0';
    await wait(500);
    activeBubble.style.display='none';
    activeBubble.style.opacity='1';
  }
  activeBubble=el;
  activeBubbleAnchor=anchor;
  el.textContent=msg;
  el.style.display='block';
  el.style.opacity='1';
  positionBubble(el,world);
  lastBubbleShownAt=performance.now();
}
function hideBubbles(){
  rb.style.display=cb.style.display='none';
  rb.style.opacity=cb.style.opacity='1';
  activeBubble=null;
  activeBubbleAnchor=null;
}

let speed=1,playing=false,paused=false,stepMode=false,stepResolve=null,currentIndex=0;
document.getElementById('speed').oninput=e=>speed=Number(e.target.value);
const wait=ms=>new Promise(r=>setTimeout(r,ms/Math.max(.1,speed)));
async function waitAfterBubble(){
  if(!lastBubbleShownAt)return;
  const elapsed=performance.now()-lastBubbleShownAt;
  const target=2000/Math.max(.1,speed);
  if(elapsed<target)await new Promise(r=>setTimeout(r,target-elapsed));
}

function tween(obj,to,ms=850){
  const from=obj.position.clone();const start=performance.now();return new Promise(resolve=>{
    function f(now){const u=Math.min(1,(now-start)/(ms/Math.max(.1,speed))),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;obj.position.lerpVectors(from,to,e);if(u<1)requestAnimationFrame(f);else resolve()}requestAnimationFrame(f);
  });
}
async function runRobot(to,ms=900){
  await waitAfterBubble();
  robot.userData.walking=true;
  const dx=to.x-robot.position.x;
  robot.rotation.y=dx>=0?Math.PI/2:-Math.PI/2;
  await tween(robot,to,ms);
  robot.userData.walking=false;
  robot.rotation.y=0;
  robot.userData.armL.rotation.z=0;
  robot.userData.armR.rotation.z=0;
}
function gripWorld(){return worldOf(robot.userData.grip)}
async function grabToken(token){
  detachKeepWorld(token,scene);
  robot.userData.armL.rotation.z=.72;
  robot.userData.armR.rotation.z=-.72;
  await tween(token,gripWorld(),420);
  robot.attach(token);
  token.position.copy(robot.userData.grip.position);
  faceViewer(token);
}
async function releaseTokenTo(token,target,ms=650){
  detachKeepWorld(token,scene);
  robot.userData.armL.rotation.z=.25;
  robot.userData.armR.rotation.z=-.25;
  await tween(token,target,ms);
  robot.userData.armL.rotation.z=0;
  robot.userData.armR.rotation.z=0;
}
function nextWaitingPoint(){
  const waiting=sourceTokens
    .filter(t=>t.parent===conveyor&&t.visible)
    .map(t=>({t,p:worldOf(t)}))
    .sort((a,b)=>a.p.x-b.p.x);
  if(!waiting.length)return ROBOT_HOME.clone();
  return new THREE.Vector3(waiting[0].p.x,0,.15);
}
async function goHome(){
  const target=nextWaitingPoint();
  const hasNext=sourceTokens.some(t=>t.parent===conveyor&&t.visible);
  lesson('Робот готов к следующему токену',hasNext?'Он возвращается не в начало ленты, а прямо к первому оставшемуся элементу слева.':'Во входном потоке больше ничего не осталось.');
  await runRobot(target,700+Math.abs(robot.position.x-target.x)*75);
}
async function robotSay(msg){
  await bubble(rb,msg,worldOf(robot).add(new THREE.Vector3(0,4.1,0)),robot);
}
async function calcSay(msg){
  await bubble(cb,msg,worldOf(calc).add(new THREE.Vector3(-1.15,3.65,.15)),calc);
}
async function checkpoint(){
  if(!stepMode)return;
  await new Promise(r=>stepResolve=r);
  stepResolve=null;
}
function releaseStep(){
  if(stepResolve){const r=stepResolve;stepResolve=null;r()}
}
function detachKeepWorld(obj,newParent){obj.updateMatrixWorld();const p=new THREE.Vector3(),q=new THREE.Quaternion(),s=new THREE.Vector3();obj.matrixWorld.decompose(p,q,s);newParent.add(obj);obj.position.copy(newParent.worldToLocal(p.clone()));obj.quaternion.copy(q);obj.scale.copy(s)}
function setScreen(s){calc.userData.screen.material.map.dispose();calc.userData.screen.material.map=canvasTexture(String(s),'#10252d','#a8ffd9',512,256,105);calc.userData.screen.material.needsUpdate=true}

async function approachAndInspect(source,t){
  const p=worldOf(source);
  const behind=new THREE.Vector3(p.x,0,.15);
  lesson('Робот идёт за следующим элементом',`Следующий токен: ${t}. Сначала робот должен взять его в руки.`);
  await runRobot(behind,700+Math.abs(robot.position.x-behind.x)*90);
  await grabToken(source);
  lesson('Анализ токена',`Робот держит «${t}» и решает: число это или операция?`);
  await robotSay(['+','−','-','×','*','÷','/'].includes(t)?'Хм… операция! 🧠':'Ага, число! 🧠');
  await checkpoint();
}
async function processNumber(source,value){
  lesson('Это число','Число нужно положить на вершину стека. Робот несёт его сам.');
  await runRobot(new THREE.Vector3(.9,0,.1),1000);
  const target=stackPos(stackTokens.length);
  await releaseTokenTo(source,target,650);
  stackTokens.push(source);
  updateStackLabels();
  lesson('PUSH','Число '+value+' лежит на вершине стека.');
  await wait(650);
  await checkpoint();
  await goHome();
  await checkpoint();
}
async function processOp(source,op){
  lesson('Это операция','Операцию робот относит калькулятору. Сам робот ничего не вычисляет.');
  await runRobot(new THREE.Vector3(4.8,0,.05),1050);
  await robotSay('Команда для тебя! 📮');
  const intake=worldOf(calc).add(new THREE.Vector3(-1.2,1.75,.85));
  await releaseTokenTo(source,intake,520);
  source.visible=false;
  await checkpoint();

  if(stackTokens.length<2){
    lesson('Ошибка','На стеке не хватает двух чисел.');
    await calcSay('Мне нужны два числа!');
    await waitAfterBubble();
    await checkpoint();
    await goHome();
    await checkpoint();
    return;
  }

  await calcSay('Принято! Сначала X, потом Y.');
  await waitAfterBubble();
  const x=stackTokens.pop();
  const y=stackTokens.pop();
  updateStackLabels();
  lesson('POP X, затем POP Y','Верхний элемент X снимается первым. Следующий Y — вторым. Для − и ÷ порядок критически важен.');
  await tween(x,worldOf(calc).add(new THREE.Vector3(.55,3.0,.8)),700);
  await tween(y,worldOf(calc).add(new THREE.Vector3(-.55,3.0,.8)),700);
  await checkpoint();

  const a=Number(y.userData.text),b=Number(x.userData.text);
  const sym=op==='×'?'*':op==='÷'?'/':op;
  const result=sym==='+'?a+b:sym==='-'?a-b:sym==='*'?a*b:a/b;
  setScreen(`${a} ${op} ${b} = ${result}`);
  lesson('Вычисление',`Калькулятор выполняет ${a} ${op} ${b} и получает ${result}.`);
  await calcSay(`${a} ${op} ${b} = ${result}! 🎉`);
  await waitAfterBubble();
  x.visible=false;y.visible=false;
  await checkpoint();

  const res=boxToken(String(result),0x7de0b3);
  res.position.copy(worldOf(calc).add(new THREE.Vector3(0,1.0,1.0)));
  scene.add(res);

  lesson('Забрать результат','Теперь робот должен забрать результат у калькулятора.');
  await runRobot(new THREE.Vector3(5.0,0,.05),320);
  await grabToken(res);
  await robotSay('Есть! Несу обратно на стек.');
  await checkpoint();

  lesson('PUSH результата','Робот относит новый результат на вершину стека.');
  await runRobot(new THREE.Vector3(.9,0,.1),900);
  await releaseTokenTo(res,stackPos(stackTokens.length),650);
  stackTokens.push(res);
  updateStackLabels();
  await wait(350);
  await checkpoint();
  await goHome();
  await checkpoint();
}
async function runToken(i){
  const src=sourceTokens[i],t=src.userData.text;
  await checkpoint();
  await approachAndInspect(src,t);
  if(['+','−','-','×','*','÷','/'].includes(t))await processOp(src,t);else await processNumber(src,t);
}

async function run(){
  if(playing)return;playing=true;
  document.getElementById('play').textContent='❚❚ Pause';
  for(;currentIndex<sourceTokens.length;currentIndex++){
    if(!playing)break;
    await runToken(currentIndex);
  }
  if(currentIndex>=sourceTokens.length){
    lesson('Готово!','В стеке остался один результат: 35. Так выражение 3 4 + 5 × означает (3 + 4) × 5.');
    setScreen('35');
  }
  playing=false;paused=false;stepMode=false;document.getElementById('play').textContent='▶ Play';
}
document.getElementById('play').onclick=()=>{
  if(playing){
    paused=!paused;
    if(!paused){stepMode=false;releaseStep()}
    document.getElementById('play').textContent=paused?'▶ Continue':'❚❚ Pause';
    return;
  }
  paused=false;
  stepMode=false;
  releaseStep();
  run();
};
document.getElementById('step').onclick=async()=>{
  stepMode=true;
  paused=true;
  if(!playing){
    run();
    await wait(20);
  }
  releaseStep();
};
document.getElementById('reset').onclick=()=>location.reload();

function resize(){
  camera.aspect=innerWidth/innerHeight;
  const portrait=innerHeight>innerWidth;
  if(portrait){
    camera.fov=61;
    camera.position.set(-.6,12.3,27.8);
    camera.lookAt(-.6,2.15,.15);
  }else if(innerWidth<900){
    camera.fov=44;
    camera.position.set(-.6,9.15,20.6);
    camera.lookAt(-.6,2.15,.15);
  }else{
    camera.fov=37;
    camera.position.set(-.6,8.15,17.9);
    camera.lookAt(-.6,2.2,.10);
  }
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  if(robot.userData.walking){
    const swing=Math.sin(t*10)*.55;
    robot.userData.armL.rotation.x=swing;
    robot.userData.armR.rotation.x=-swing;
    robot.userData.legs.forEach((leg,i)=>leg.rotation.x=(i%2?1:-1)*swing*.55);
  }else{
    robot.userData.armL.rotation.x=robot.userData.armR.rotation.x=0;
    robot.userData.legs.forEach(leg=>leg.rotation.x=0);
  }
  calc.position.y=Math.sin(t*1.5+.8)*.025;

  if(activeBubble&&activeBubbleAnchor){
    const anchor=activeBubbleAnchor===robot
      ? worldOf(robot).add(new THREE.Vector3(0,4.1,0))
      : worldOf(calc).add(new THREE.Vector3(-1.15,3.65,.15));
    positionBubble(activeBubble,anchor);
  }

  [...sourceTokens,...stackTokens].forEach(faceViewer);
  scene.traverse(o=>{if(o.userData?.isToken)faceViewer(o)});
  renderer.render(scene,camera);
}
updateStackLabels();
animate();
</script>
