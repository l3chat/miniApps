<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Three.js Particle Cylinder</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060a1c}
  canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060a1c);
scene.fog = null;

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const COUNT = innerWidth < 600 ? 3600 : 6200;
const CYLINDER_RADIUS = 1.48;
const H = 5.05;
const ROTATION_SPEED = 0.315;

const pos = new Float32Array(COUNT * 3);
const sizes = new Float32Array(COUNT);
const brightness = new Float32Array(COUNT);

for (let i = 0; i < COUNT; i++) {
  const angle = Math.random() * Math.PI * 2;
  const y = (Math.random() - 0.5) * H;

  pos[i * 3] = Math.cos(angle) * CYLINDER_RADIUS;
  pos[i * 3 + 1] = y;
  pos[i * 3 + 2] = Math.sin(angle) * CYLINDER_RADIUS;

  sizes[i] = 0.65 + Math.random() * 1.55;
  brightness[i] = 0.62 + Math.random() * 0.38;
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
geometry.setAttribute('aBright', new THREE.BufferAttribute(brightness, 1));

const material = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uPixelRatio: { value: Math.min(devicePixelRatio, 2) },
    uPointScale: { value: 5.2 }
  },
  vertexShader: `
    uniform float uPixelRatio;
    uniform float uPointScale;
    attribute float aSize;
    attribute float aBright;
    varying float vAlpha;

    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = aSize * uPixelRatio * uPointScale;
      vAlpha = aBright;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 p = gl_PointCoord - 0.5;
      float d = length(p);
      if(d > 0.5) discard;
      float core = smoothstep(0.50, 0.0, d);
      float halo = smoothstep(0.50, 0.12, d);
      float a = (0.42 * halo + 0.85 * core) * vAlpha;
      vec3 col = mix(vec3(0.43,0.57,0.95), vec3(0.92,0.96,1.0), core);
      gl_FragColor = vec4(col, a);
    }
  `
});

const cloud = new THREE.Points(geometry, material);
const group = new THREE.Group();
group.add(cloud);
scene.add(group);

group.rotation.x = 0;
group.rotation.z = 0;

const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  group.rotation.y += ROTATION_SPEED * delta;
  renderer.render(scene, camera);
}
animate();

function fitCamera(){
  const aspect = innerWidth / innerHeight;
  const margin = 1.10;
  const halfHeight = H * 0.52 * margin;
  const halfWidth = halfHeight * aspect;

  camera.left = -halfWidth;
  camera.right = halfWidth;
  camera.top = halfHeight;
  camera.bottom = -halfHeight;
  camera.updateProjectionMatrix();

  const pixelRatio = Math.min(devicePixelRatio, 2);
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  material.uniforms.uPixelRatio.value = pixelRatio;

  const shortSide = Math.min(innerWidth, innerHeight);
  material.uniforms.uPointScale.value = 5.2 * (shortSide / 800);
}

addEventListener('resize', fitCamera);
fitCamera();
</script>
</body>
</html>
