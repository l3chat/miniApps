<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Three.js Particle Cylinder</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060a1c}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .mode-switch{
    position:fixed;
    top:calc(10px + env(safe-area-inset-top,0px));
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    display:flex;
    gap:14px;
    align-items:center;
    padding:7px 12px;
    border-radius:999px;
    background:rgba(6,10,28,.58);
    color:#eef4ff;
    font:600 16px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
    user-select:none;
    -webkit-user-select:none;
    backdrop-filter:blur(5px);
  }
  .mode-switch label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .mode-switch input{margin:0;width:17px;height:17px;accent-color:#b9c9ff}
</style>
</head>
<body>
<div class="mode-switch" aria-label="Cylinder mode">
  <label><input type="radio" name="mode" value="1" checked>1</label>
  <label><input type="radio" name="mode" value="2">2</label>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060a1c);
scene.fog = null;

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const COUNT = innerWidth < 600 ? 3600 : 6200;
const CYLINDER_RADIUS = 1.48;
const H = 5.05;
const ROTATION_SPEED = 0.315;

const topPos = [];
const topSizes = [];
const topBrightness = [];
const bottomPos = [];
const bottomSizes = [];
const bottomBrightness = [];

for (let i = 0; i < COUNT; i++) {
  const angle = Math.random() * Math.PI * 2;
  const y = (Math.random() - 0.5) * H;
  const x = Math.cos(angle) * CYLINDER_RADIUS;
  const z = Math.sin(angle) * CYLINDER_RADIUS;
  const size = 0.65 + Math.random() * 1.55;
  const bright = 0.62 + Math.random() * 0.38;

  if (y >= 0) {
    topPos.push(x, y, z);
    topSizes.push(size);
    topBrightness.push(bright);
  } else {
    bottomPos.push(x, y, z);
    bottomSizes.push(size);
    bottomBrightness.push(bright);
  }
}

function makeGeometry(positions, sizes, brightness){
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));
  geometry.setAttribute('aBright', new THREE.Float32BufferAttribute(brightness, 1));
  return geometry;
}

const material = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uPixelRatio: { value: Math.min(devicePixelRatio, 2) },
    uPointScale: { value: 5.2 }
  },
  vertexShader: `
    uniform float uPixelRatio;
    uniform float uPointScale;
    attribute float aSize;
    attribute float aBright;
    varying float vAlpha;

    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = aSize * uPixelRatio * uPointScale;
      vAlpha = aBright;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 p = gl_PointCoord - 0.5;
      float d = length(p);
      if(d > 0.5) discard;
      float core = smoothstep(0.50, 0.0, d);
      float halo = smoothstep(0.50, 0.12, d);
      float a = (0.42 * halo + 0.85 * core) * vAlpha;
      vec3 col = mix(vec3(0.43,0.57,0.95), vec3(0.92,0.96,1.0), core);
      gl_FragColor = vec4(col, a);
    }
  `
});

const topCloud = new THREE.Points(
  makeGeometry(topPos, topSizes, topBrightness),
  material
);
const bottomCloud = new THREE.Points(
  makeGeometry(bottomPos, bottomSizes, bottomBrightness),
  material
);

scene.add(topCloud, bottomCloud);

let mode = 1;

document.querySelectorAll('input[name="mode"]').forEach(input => {
  input.addEventListener('change', () => {
    mode = Number(document.querySelector('input[name="mode"]:checked').value);
    if (mode === 2) {
      bottomCloud.rotation.y = topCloud.rotation.y;
    } else {
      bottomCloud.rotation.y = topCloud.rotation.y;
    }
  });
});

const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  topCloud.rotation.y += ROTATION_SPEED * delta;

  if (mode === 1) {
    bottomCloud.rotation.y = topCloud.rotation.y;
  } else {
    bottomCloud.rotation.y += ROTATION_SPEED * 1.10 * delta;
  }

  renderer.render(scene, camera);
}
animate();

function fitCamera(){
  const aspect = innerWidth / innerHeight;
  const margin = 1.10;
  const halfHeight = H * 0.52 * margin;
  const halfWidth = halfHeight * aspect;

  camera.left = -halfWidth;
  camera.right = halfWidth;
  camera.top = halfHeight;
  camera.bottom = -halfHeight;
  camera.updateProjectionMatrix();

  const pixelRatio = Math.min(devicePixelRatio, 2);
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  material.uniforms.uPixelRatio.value = pixelRatio;

  const worldViewWidth = camera.right - camera.left;
  const cylinderPixelWidth = (2 * CYLINDER_RADIUS / worldViewWidth) * innerWidth;
  material.uniforms.uPointScale.value = 5.2 * (cylinderPixelWidth / 600);
}

addEventListener('resize', fitCamera);
fitCamera();
</script>
</body>
</html>
