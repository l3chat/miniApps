<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Игра «Сумма»</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--gap:clamp(10px,2vw,18px)}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:Canvas;color:CanvasText}.wrap{min-height:100dvh;max-width:980px;margin:auto;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:grid;grid-template-rows:auto 1fr;gap:var(--gap)}header{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:1.05rem;font-weight:800}.topmeta{display:flex;align-items:center;gap:8px;font-size:.82rem;opacity:.72}.dot{width:9px;height:9px;border-radius:50%;background:#f59e0b}.dot.online{background:#22c55e}.grid{display:grid;gap:var(--gap)}.two{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.card{border:1px solid color-mix(in srgb,CanvasText 16%,transparent);border-radius:18px;padding:clamp(14px,3vw,22px);background:color-mix(in srgb,Canvas 94%,CanvasText 6%)}h1,h2,h3,p{margin:.15em 0}.muted{opacity:.68}.small{font-size:.86rem}.hidden{display:none!important}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1 1 180px}label{display:grid;gap:6px;font-weight:650}input[type=text],input[type=number]{width:100%;font:inherit;padding:13px 14px;border-radius:13px;border:1px solid color-mix(in srgb,CanvasText 24%,transparent);background:Canvas;color:CanvasText}button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:13px 17px;cursor:pointer;background:#2563eb;color:#fff}button.secondary{background:color-mix(in srgb,CanvasText 13%,Canvas);color:CanvasText}button:disabled{opacity:.42;cursor:not-allowed}.roomcode{font-size:1.55rem;font-weight:900;letter-spacing:.12em}.playzone{display:grid;gap:clamp(14px,3vh,26px);align-content:center;min-height:calc(100dvh - 92px)}.target{text-align:center}.target .label{font-size:.82rem;text-transform:uppercase;letter-spacing:.14em;opacity:.58}.target .value{font-size:clamp(2rem,9vw,5.3rem);font-weight:950;line-height:1}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2vw,16px)}.numberbtn{min-height:clamp(72px,14vh,120px);font-size:clamp(2rem,8vw,4rem);border-radius:22px;background:color-mix(in srgb,#2563eb 90%,Canvas)}.numberbtn.selected{outline:5px solid #22c55e;transform:scale(1.025)}.readybtn{min-height:clamp(68px,11vh,96px);font-size:clamp(1.4rem,5vw,2.2rem);background:#16a34a}.readybtn.ready{background:#ea580c}.hint{text-align:center;font-size:.92rem;opacity:.66;min-height:1.4em}.resultCard{text-align:center;padding:clamp(20px,5vw,34px);border-width:2px}.resultWord{font-size:clamp(2.4rem,10vw,6rem);font-weight:950;line-height:1.05}.resultWord.ok{color:#16a34a}.resultWord.bad{color:#dc2626}.scoreline{display:flex;justify-content:center;gap:clamp(18px,8vw,70px);margin:18px 0}.scorebox .n{font-size:clamp(2rem,8vw,4.8rem);font-weight:950}.scorebox .t{font-size:.82rem;text-transform:uppercase;letter-spacing:.12em;opacity:.6}.players{display:grid;gap:8px}.player{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,CanvasText 7%,Canvas)}details{border-radius:14px;background:color-mix(in srgb,CanvasText 5%,Canvas);padding:10px 12px}summary{cursor:pointer;font-weight:750}.message{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,#f59e0b 20%,Canvas)}.hostLayout{display:grid;gap:var(--gap)}.hostControls{display:grid;gap:var(--gap)}.hostPlay .numberbtn{min-height:64px;font-size:2rem}.hostPlay .readybtn{min-height:58px;font-size:1.15rem}.hostJoin{display:grid;gap:10px}.hostResult{margin-top:var(--gap)}@media(min-width:760px){.numbers{grid-template-columns:repeat(6,1fr)}.numberbtn{min-height:105px}.hostLayout{grid-template-columns:minmax(300px,.9fr) minmax(340px,1.1fr)}}@media(orientation:landscape) and (max-height:650px){.playzone{min-height:auto;align-content:start;gap:10px}.target .value{font-size:2.5rem}.numberbtn{min-height:58px;font-size:1.8rem}.readybtn{min-height:54px;font-size:1.25rem}.wrap{padding:8px}.card{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">Игра «Сумма»</div>
  <div class="topmeta"><span id="connDot" class="dot"></span><span id="conn">не подключено</span><button id="homeBtn" class="secondary hidden" style="padding:7px 10px">Выйти</button></div>
</header>
<main class="grid">
<section id="landing" class="grid two">
  <div class="card grid"><h2>Ведущий</h2><p class="muted">Создайте комнату и отправьте ссылку участникам.</p><button id="createBtn">Создать комнату</button></div>
  <div class="card grid"><h2>Участник</h2><label>Код комнаты<input id="joinCode" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABC234"></label><button id="joinByCode">Войти</button></div>
</section>

<section id="playerPanel" class="hidden">
  <div id="playerJoin" class="card grid">
    <h2>Как вас зовут?</h2>
    <input id="nameInput" type="text" maxlength="40" autocomplete="name" placeholder="Имя">
    <button id="saveName">Войти в игру</button>
    <div class="small muted">Комната <strong id="playerCode"></strong></div>
  </div>
  <div id="playerPlay" class="playzone hidden">
    <div class="target"><div class="label">Цель</div><div id="targetDisplay" class="value">—</div></div>
    <div class="numbers" id="numbers"></div>
    <button id="readyBtn" class="readybtn" disabled>Готов</button>
    <div id="playerHint" class="hint"></div>
    <details><summary>Информация</summary><div class="small muted" style="margin-top:8px">Комната <strong id="playerCodeInfo"></strong> · <span id="roundInfo">ожидание раунда</span></div></details>
  </div>
  <div id="playerResult" class="card resultCard hidden"></div>
</section>

<section id="hostPanel" class="grid hidden">
  <div class="card">
    <div class="row"><div class="grow"><div class="small muted">Комната</div><div id="hostCode" class="roomcode"></div></div><button id="copyLink">Копировать ссылку</button><button id="shareLink" class="secondary">Поделиться</button></div>
  </div>
  <div class="hostLayout">
    <div class="hostControls">
      <div class="card grid">
        <h2>Раунд</h2>
        <label>Загаданное число<input id="targetInput" type="number" step="1" inputmode="numeric"></label>
        <label class="row"><input id="targetVisible" type="checkbox">Показывать сразу</label>
        <button id="startRound">Начать новый раунд</button>
        <button id="revealBtn" disabled>Раскрыть результат</button>
      </div>
      <details open><summary>Участники · <span id="readyInfo">0</span></summary><div id="hostPlayers" class="players" style="margin-top:10px"></div></details>
    </div>
    <div class="card hostPlay grid">
      <h2>Мой ход</h2>
      <div id="hostJoin" class="hostJoin">
        <p class="muted">Ведущий может играть наравне со всеми.</p>
        <input id="hostNameInput" type="text" maxlength="40" autocomplete="name" placeholder="Ваше имя">
        <button id="hostJoinBtn">Участвовать в игре</button>
      </div>
      <div id="hostPlayControls" class="grid hidden">
        <div class="target"><div class="label">Ваш выбор</div><div id="hostChoice" class="value">—</div></div>
        <div class="numbers" id="hostNumbers"></div>
        <button id="hostReadyBtn" class="readybtn" disabled>Готов</button>
        <div id="hostHint" class="hint"></div>
      </div>
    </div>
  </div>
  <div id="hostResult" class="card resultCard hostResult hidden"></div>
</section>

<div id="message" class="message hidden"></div>
</main>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);const basePath='/zoom-sum-game/';const apiBase=basePath+'api/';
let ws=null,state=null,role=null,room=null,hostSecret=null,retryTimer=null,retryCount=0,manualClose=false,heartbeat=null;const pending=[];
const clientIdKey='zoomSumGameClientId';const hostKeyPrefix='zoomSumGameHost:';const nameKey='zoomSumGameName';let clientId=localStorage.getItem(clientIdKey);if(!clientId){clientId=crypto.randomUUID?.()||Math.random().toString(36).slice(2)+Date.now();localStorage.setItem(clientIdKey,clientId)}
function msg(text){$('message').textContent=text;$('message').classList.toggle('hidden',!text)}
function setConn(text,online=false){$('conn').textContent=text;$('connDot').classList.toggle('online',online)}
function showPanel(id){$('landing').classList.add('hidden');$('playerPanel').classList.add('hidden');$('hostPanel').classList.add('hidden');$(id).classList.remove('hidden');$('homeBtn').classList.remove('hidden'%)}
function normalizeCode(v){return String(v||'').toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g,'').slice(0,6)}
function roomFromLocation(){return normalizeCode(new URL(location.href).searchParams.get('room'))}
function hostSecretFromLocation(){return new URL(location.href).searchParams.get('host')||''}
function participantLink(){const u=new URL(basePath,location.origin);u.searchParams.set('room',room);return u.href}
function isQueueable(data){return ['join','select','setReady'].includes(data.type)}
function send(data){if(ws&&ws.readyState===WebSocket.OPEN){ws.send(JSON.stringify(data));return true}if(isQueueable(data)){pending.push(data);if(pending.length>8)pending.shift();msg('Соединение восстанавливается…');openSocket();return false}msg('Нет соединения с сервером');return false}
function flushPending(){while(pending.length&&ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(pending.shift()))}
async function createRoom(){msg('');$('createBtn').disabled=true;try{const r=await fetch(apiBase+'create',{method:'POST'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Ошибка создания комнаты');room=d.room;hostSecret=d.hostSecret;localStorage.setItem(hostKeyPrefix+room,hostSecret);const u=new URL(basePath,location.origin);u.searchParams.set('room',room);u.searchParams.set('host',hostSecret);history.replaceState(null,'',u);startHost()}catch(e){msg(e.message)}finally{$('createBtn').disabled=false}}
function openSocket(){if(!room)return;if(ws&&(ws.readyState===WebSocket.OPEN||ws.readyState===WebSocket.CONNECTING))return;clearTimeout(retryTimer);manualClose=false;const proto=location.protocol==='https:'?'wss:':'ws:';const u=new URL(apiBase+'ws',location.href);u.protocol=proto;u.searchParams.set('room',room);u.searchParams.set('clientId',clientId);u.searchParams.set('role',role);if(role==='host')u.searchParams.set('secret',hostSecret);setConn('Podklychenie…');ws=new WebSocket(u);ws.onopen=()=>{retryCount=0;setConn('v seti',true);msg('');clearInterval(heartbeat);heartbeat=setInterval(()=>{if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'ping'}))},20000);flushPending()};ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='state'){state=d;render()}else if(d.type==='error')msg(d.message)}catch{}};ws.onclose=()=>{clearInterval(heartbeat);setConn('net svyazi');if(!manualClose)scheduleReconnect()};ws.onerror=()=>setConn('oshibk svyazi')}
function scheduleReconnect(){clearTimeout(retryTimer);const delay=Math.min(10000,500*2**Math.min(retryCount++,4));retryTimer=setTimeout(openSocket,delay)}
function startHost(){role='host';showPanel('hostPanel');$('hostCode').textContent=room;$('hostNameInput').value=localStorage.getItem(nameKey)||'';openSocket()}
function startPlayer(){role='player';showPanel('playerPanel');$('playerCode').textContent=room;$('playerCodeInfo').textContent=room;$('nameInput').value=localStorage.getItem(nameKey)||'';openSocket()}
function render(){if(role==='host')renderHost();else renderPlayer()}
function renderPlayer(){const me=state?.me;if(!me){$('playerJoin').classList.remove('hidden');$('playerPlay').classList.add('hidden');$('playerResult').classList.add('hidden');return}$('playerJoin').classList.add('hidden');if(state.phase==='reveal'&&state.result){$('playerPlay').classList.add('hidden');showResult($('playerResult'),state.result);return}$('playerResult').classList.add('hidden');$('playerPlay').classList.remove('hidden');$('roundInfo').textContent=state.phase==='choosing'?`раунд ${state.round}`:'ожидание раунда';if(state.phase!=='choosing'){$('targetDisplay').textContent='—';setNumberState($('numbers'),null,true);$('readyBtn').disabled=true;$('playerHint').textContent='Ожидайте начала раунда';return}$('targetDisplay').textContent=state.target===null?'?':state.target;setNumberState($('numbers'),me.value,me.ready);$('readyBtn').disabled=!me.ready&&!Number.isInteger(me.value);$('readyBtn').textContent=me.ready?)Изменить выбор':'Готов';$('readyBtn').classList.toggle('ready',me.ready);$('playerHint').textContent=me.ready?)Вы готовы. Нажмите, чтобы изменить число.':'Выберите число и подтвердите.'}
function renderHost(){const players=state?.players||[];const ready=players.filter(p=>p.ready).length;$('readyInfo').textContent=`${ready}/${players.length}`;$('hostPlayers').innerHTML=players.length?players.map(p=>`<div class="player"><span>${escapeHtml(p.name)}${p.clientId===clientId?' <span class="muted">(вы)</span>':''}</span><strong>${p.ready?)✓':'…'}</strong></div>`).join(''):'<div class="small muted">Пока никто не подключён</div>';$('revealBtn').disabled=!(state.phase==='choosing'&&state.allReady);if(state.phase==='reveal'&&state.result)showResult($('hostResult'),state.result);else $('hostResult').classList.add('hidden');const me=state.me;if(!me){$('hostJoin').classList.remove('hidden');$('hostPlayControls').classList.add('hidden');return}$('hostJoin').classList.add('hidden');$('hostPlayControls').classList.remove('hidden');if(state.phase!=='choosing'){$('hostChoice').textContent='—';setNumberState($('hostNumbers'),null,true);$('hostReadyBtn').disabled=true;$('hostHint').textContent=state.phase==='reveal'?'Раунд завершён':'Ожидайте начала раунда';return}$('hostChoice').textContent=Number.isInteger(me.value)?me.value:'—';setNumberState($('hostNumbers'),me.value,me.ready);$('hostReadyBtn').disabled=!me.ready&&!Number.isInteger(me.value);$('hostReadyBtn').textContent=me.ready?'Изменить выбор':'Готов';$('hostReadyBtn').classList.toggle('ready',me.ready);$('hostHint').textContent=me.ready?)Вы участвуете в сумме.':'Выберите число от 0 до 5.'}
function showResult(el,r){el.classList.remove('hidden');el.innerHTML=`<div class="resultWord ${r.success?'ok':'bad'}">${r.success?)Совпало!':'Не совпало'}</div><div class="scoreline"><div class="scorebox"><div class="t">Цель</div><div class="n">${r.target}</div></div><div class="scorebox"><div class="t">Сумма</div><div class="n">${r.sum}</div></div></div><details><summary>Числа участников</summary><div class="players" style="margin-top:10px">${r.players.map(p=>`<div class="player"><span>${escapeHtml(p.name)}</span><strong>${p.value}</strong></div>`).join('')}</div></details>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setNumberState(container,value,disabled){[...container.children].forEach(b=>{b.disabled=disabled;b.classList.toggle('selected',Number(b.dataset.value)===value)})}
function makeNumbers(container){for(let i=0;i<=5;i++){const b=document.createElement('button');b.className='numberbtn';b.textContent=i;b.dataset.value=i;b.onclick=()=>send({type:'select',value:i});container.appendChild(b)}}makeNumbers($('numbers'));makeNumbers($('hostNumbers'));
$('createBtn').onclick=createRoom;$('joinCode').oninput=e=>e.target.value=normalizeCode(e.target.value);$('joinByCode').onclick=()=>{const c=normalizeCode($('joinCode').value);if(c.length!==6)return msg('Введите код комнаты');const u=new URL(basePath,location.origin);u.searchParams.set('room',c);location.href=u.href};$('copyLink').onclick=async()=>{await navigator.clipboard.writeText(participantLink());msg('Ссылка скопирована')�};$('shareLink').onclick=async()=>{const url=participantLink();if(navigator.share)await navigator.share({title:'Игра «Сумма»',url});else{await navigator.clipboard.writeText(url);msg('Ссылка скопирована')}};$('startRound').onclick=()=>{const v=Number($('targetInput').value);if(!Number.isSafeInteger(v))return msg('Введите целое число');send({type:'startRound',target:v,targetVisible:$('targetVisible').checked})};$('revealBtn').onclick=()=>send({type:'reveal'});
function joinWithName(input){const name=input.value.trim();if(!name)return msg('Введите имя');localStorage.setItem(nameKey,name);send({type:'join',name})}$('saveName').onclick=()=>joinWithName($('nameInput'));$('hostJoinBtn').onclick=()=>joinWithName($('hostNameInput'));$('readyBtn').onclick=()=>{if(state?.me)send({type:'setReady',ready:!state.me.ready})};$('hostReadyBtn').onclick=()=>{if(state?.me)send({type:'setReady',ready:!state.me.ready})};$('homeBtn').onclick=()=>{manualClose=true;clearInterval(heartbeat);try{ws?.close()}catch{};history.replaceState(null,'',basePath);location.reload()};
window.addEventListener('online',()=>openSocket());document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(!ws||ws.readyState>1))openSocket()});
room=roomFromLocation();if(room){hostSecret=hostSecretFromLocation()||localStorage.getItem(hostKeyPrefix+room)||'';if(hostSecret)startHost();else startPlayer()}else{setConn('готово')}
})();
</script>
</body>
</html>
