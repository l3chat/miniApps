<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Игра «Сумма»</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--gap:clamp(5px,1.4vmin,12px)}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:Canvas;color:CanvasText;overscroll-behavior:none}.wrap{width:100%;height:100dvh;max-width:1100px;margin:auto;padding:clamp(4px,1.2vmin,10px);display:grid;grid-template-rows:minmax(28px,auto) minmax(0,1fr);gap:clamp(4px,1.2vmin,10px);overflow:hidden}header{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:0}.brand{font-size:clamp(.82rem,2.2vmin,1.05rem);font-weight:800}.topmeta{display:flex;align-items:center;gap:5px;font-size:clamp(.65rem,1.8vmin,.82rem);opacity:.72}.dot{width:7px;height:7px;border-radius:50%;background:#f59e0b}.dot.online{background:#22c55e}.grid{display:grid;gap:var(--gap)}main{height:100%;min-height:0;overflow:hidden}.two{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.card{border:1px solid color-mix(in srgb,CanvasText 16%,transparent);border-radius:clamp(10px,2vmin,16px);padding:clamp(7px,1.7vmin,15px);background:color-mix(in srgb,Canvas 94%,CanvasText 6%)}h1,h2,h3,p{margin:.15em 0}h2{font-size:clamp(1rem,2.8vmin,1.35rem)}.muted{opacity:.68}.small{font-size:.82rem}.hidden{display:none!important}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1 1 180px}label{display:grid;gap:4px;font-weight:650}input[type=text],input[type=number]{width:100%;font:inherit;padding:clamp(7px,1.5vmin,11px);border-radius:10px;border:1px solid color-mix(in srgb,CanvasText 24%,transparent);background:Canvas;color:CanvasText}button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:clamp(7px,1.5vmin,11px) clamp(9px,2vmin,15px);cursor:pointer;background:#2563eb;color:#fff}button.secondary{background:color-mix(in srgb,CanvasText 13%,Canvas);color:CanvasText}button:disabled{opacity:.42;cursor:not-allowed}#homeBtn{padding:5px 8px!important}.roomcode{font-size:clamp(1.05rem,3.7vmin,1.55rem);font-weight:900;line-height:1;letter-spacing:.09em}.target{text-align:center}.target .label{font-size:clamp(.62rem,1.8vmin,.8rem);text-transform:uppercase;letter-spacing:.14em;opacity:.58}.target .value{font-size:clamp(1.6rem,8vmin,4.5rem);font-weight:950;line-height:.95}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(5px,1.4vmin,12px);min-height:0}.numberbtn{min-height:0;font-size:clamp(1.45rem,6vmin,3.4rem);border-radius:clamp(10px,2.5vmin,18px);padding:2px;background:color-mix(in srgb,#2563eb 90%,Canvas)}.numberbtn.selected{outline:4px solid #22c55e;transform:scale(1.02)}.readybtn{min-height:clamp(42px,8.5dvh,72px);font-size:clamp(1.05rem,3.5vmin,1.8rem);background:#16a34a}.readybtn.ready{background:#ea580c}.hint{text-align:center;font-size:clamp(.68rem,1.9vmin,.88rem);opacity:.66;min-height:1em;line-height:1.1}.players{display:grid;gap:6px}.player{display:flex;justify-content:space-between;gap:10px;padding:7px 9px;border-radius:10px;background:color-mix(in srgb,CanvasText 7%,Canvas)}details{border-radius:10px;background:color-mix(in srgb,CanvasText 5%,Canvas);padding:clamp(6px,1.3vmin,9px);min-height:0}summary{cursor:pointer;font-weight:750;font-size:clamp(.78rem,2vmin,.95rem)}details[open] .players{max-height:18dvh;overflow:auto}.message{position:absolute;left:8px;right:8px;bottom:8px;z-index:50;padding:7px 9px;border-radius:10px;background:color-mix(in srgb,#f59e0b 20%,Canvas);font-size:.82rem}.countdownOverlay{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:color-mix(in srgb,Canvas 94%,transparent)}.countdownText{font-size:clamp(6rem,30vw,15rem);font-weight:1000;line-height:1;text-align:center}.countdownText.start{font-size:clamp(4rem,20vw,10rem)}
#landing,#playerPanel,#hostPanel{height:100%;min-height:0;overflow:hidden}#playerPanel:not(.hidden){display:grid}.playzone{height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto auto;gap:clamp(4px,1.4vh,12px)}.playzone .numbers{height:100%;grid-auto-rows:minmax(0,1fr)}.playzone .numberbtn{height:100%}.resultCard{height:100%;min-height:0;overflow:hidden;display:grid;align-content:center;gap:clamp(5px,1.6vmin,14px);text-align:center;padding:clamp(10px,2.5vmin,24px);border-width:2px}.resultWord{font-size:clamp(2rem,9vmin,5.2rem);font-weight:950;line-height:1.05}.resultWord.ok{color:#16a34a}.resultWord.bad{color:#dc2626}.scoreline{display:flex;justify-content:center;gap:clamp(16px,7vmin,60px);margin:clamp(4px,1.5vmin,12px) 0}.scorebox .n{font-size:clamp(1.8rem,7vmin,4rem);font-weight:950}.scorebox .t{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;opacity:.6}.resultCard details[open]{max-height:30dvh;overflow:hidden}.resultCard details[open] .players{max-height:22dvh;overflow:auto}
#hostPanel:not(.hidden){display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(4px,1.2vmin,10px)}#hostPanel>.card:first-child{padding:clamp(5px,1.2vmin,9px)}#hostPanel>.card:first-child .small{font-size:.68rem}#hostPanel>.card:first-child button{padding:clamp(5px,1.1vmin,8px) clamp(7px,1.6vmin,11px);font-size:clamp(.68rem,1.8vmin,.85rem)}.hostLayout{display:grid;height:100%;min-height:0;overflow:hidden;gap:clamp(5px,1.2vmin,10px);grid-template-columns:minmax(250px,.85fr) minmax(280px,1.15fr)}.hostControls,.hostPlay{min-height:0;overflow:hidden}.hostControls{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:var(--gap)}.hostControls>.card{min-height:0;overflow:hidden;align-content:center}.hostControls label{font-size:clamp(.72rem,1.8vmin,.9rem);gap:3px}.hostControls>.card button{font-size:clamp(.7rem,1.8vmin,.9rem)}.hostPlay{align-content:center}.hostJoin{display:grid;gap:clamp(4px,1vmin,8px)}.hostJoin p{font-size:clamp(.68rem,1.7vmin,.85rem)}.hostPlay .target .value{font-size:clamp(1.5rem,5vmin,3.2rem)}.hostPlay .numbers{grid-template-columns:repeat(6,1fr)}.hostPlay .numberbtn{height:clamp(38px,8dvh,68px);font-size:clamp(1.15rem,3.6vmin,2rem);border-radius:10px}.hostPlay .readybtn{min-height:clamp(38px,7dvh,58px);font-size:clamp(.9rem,2.5vmin,1.15rem)}.hostResult{height:auto;max-height:100%;margin-top:0}
@media(min-width:760px){.numbers{grid-template-columns:repeat(6,1fr)}}@media(max-width:699px){.hostLayout{grid-template-columns:1fr;grid-template-rows:minmax(0,.9fr) minmax(0,1.1fr)}.hostControls>.card{grid-template-columns:1fr 1fr;grid-auto-rows:min-content;column-gap:8px;row-gap:5px}.hostControls>.card h2,.hostControls>.card>label:first-of-type{grid-column:1/-1}.hostPlay{padding:7px 9px}.hostJoin p{display:none}}@media(max-height:620px){.wrap{padding:4px;gap:4px;grid-template-rows:24px minmax(0,1fr)}header{height:24px}.brand{font-size:.78rem}.topmeta{font-size:.62rem}.card{padding:6px 8px}.grid{gap:4px}h2{font-size:.92rem}input[type=text],input[type=number]{padding:5px 7px;font-size:.82rem}button{padding:5px 7px;font-size:.78rem}.playzone{gap:4px}.target .value{font-size:clamp(1.25rem,7vmin,2.3rem)}.readybtn{min-height:34px;font-size:1rem}.hint{font-size:.65rem}.hostLayout{grid-template-columns:minmax(210px,.8fr) minmax(250px,1.2fr);grid-template-rows:1fr}.hostControls>.card{grid-template-columns:1fr 1fr;grid-auto-rows:min-content;column-gap:6px;row-gap:3px}.hostControls>.card h2,.hostControls>.card>label:first-of-type{grid-column:1/-1}.hostJoin p{display:none}.hostPlay .numberbtn{height:34px}.hostPlay .readybtn{min-height:32px}.hostPlay .target .value{font-size:1.6rem}}@media(max-width:420px) and (min-height:621px){.topmeta #conn{display:none}#hostPanel>.card:first-child .row{flex-wrap:nowrap}#hostPanel>.card:first-child .grow{flex:1 1 auto;min-width:70px}#hostPanel>.card:first-child button{padding:5px 6px;font-size:.68rem}}
</style>
</head>
<body>
<div id="countdownOverlay" class="countdownOverlay hidden"><div id="countdownText" class="countdownText">3</div></div>
<div class="wrap">
<header><div class="brand">Игра «Сумма»</div><div class="topmeta"><span id="connDot" class="dot"></span><span id="conn">не подключено</span><button id="homeBtn" class="secondary hidden">Выйти</button></div></header>
<main class="grid">
<section id="landing" class="grid two"><div class="card grid"><h2>Ведущий</h2><p class="muted">Создайте комнату и отправьте ссылку участникам.</p><button id="createBtn">Создать комнату</button></div><div class="card grid"><h2>Участник</h2><label>Код комнаты<input id="joinCode" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABC234"></label><button id="joinByCode">Войти</button></div></section>
<section id="playerPanel" class="hidden"><div id="playerJoin" class="card grid"><h2>Как вас зовут?</h2><input id="nameInput" type="text" maxlength="40" autocomplete="name" placeholder="Имя"><button id="saveName">Войти в игру</button><div class="small muted">Комната <strong id="playerCode"></strong></div></div><div id="playerPlay" class="playzone hidden"><div class="target"><div class="label">Цель</div><div id="targetDisplay" class="value">—</div></div><div class="numbers" id="numbers"></div><button id="readyBtn" class="readybtn" disabled>Готов</button><div id="playerHint" class="hint"></div><details><summary>Информация</summary><div class="small muted" style="margin-top:8px">Комната <strong id="playerCodeInfo"></strong> · <span id="roundInfo">ожидание раунда</span></div></details></div><div id="playerResult" class="card resultCard hidden"></div></section>
<section id="hostPanel" class="hidden"><div class="card"><div class="row"><div class="grow"><div class="small muted">Комната</div><div id="hostCode" class="roomcode"></div></div><button id="copyLink">Копировать ссылку</button><button id="shareLink" class="secondary">Поделиться</button></div></div><div class="hostLayout"><div class="hostControls"><div class="card grid"><h2>Раунд</h2><label>Загаданное число<input id="targetInput" type="number" step="1" inputmode="numeric"></label><label class="row"><input id="targetVisible" type="checkbox">Показывать цель</label><label class="row"><input id="countdownMode" type="checkbox">Обратный отсчёт</label><button id="startRound">Начать новый раунд</button><button id="revealBtn" disabled>Раскрыть результат</button></div><details><summary>Участники · <span id="readyInfo">0</span></summary><div id="hostPlayers" class="players" style="margin-top:8px"></div></details></div><div class="card hostPlay grid"><h2>Мой ход</h2><div id="hostJoin" class="hostJoin"><p class="muted">Ведущий может играть наравне со всеми.</p><input id="hostNameInput" type="text" maxlength="40" autocomplete="name" placeholder="Ваше имя"><button id="hostJoinBtn">Участвовать в игре</button></div><div id="hostPlayControls" class="grid hidden"><div class="target"><div class="label">Цель</div><div id="hostChoice" class="value">—</div></div><div class="numbers" id="hostNumbers"></div><button id="hostReadyBtn" class="readybtn" disabled>Готов</button><div id="hostHint" class="hint"></div></div></div></div><div id="hostResult" class="card resultCard hostResult hidden"></div></section>
<div id="message" class="message hidden"></div>
</main></div>
<script>
(()=>{
const $=id=>document.getElementById(id),basePath='/zoom-sum-game/',apiBase=basePath+'api/';let ws=null,state=null,role=null,room=null,hostSecret=null,retryTimer=null,retryCount=0,manualClose=false,heartbeat=null,countdownTicker=null,clockOffset=0,choicePending=false,targetDebounce=null;const pending=[];const clientIdKey='zoomSumGameClientId',hostKeyPrefix='zoomSumGameHost:',nameKey='zoomSumGameName';let clientId=localStorage.getItem(clientIdKey);if(!clientId){clientId=crypto.randomUUID?.()||Math.random().toString(36).slice(2)+Date.now();localStorage.setItem(clientIdKey,clientId)}
function msg(t){$('message').textContent=t;$('message').classList.toggle('hidden',!t)}function setConn(t,o=false){$('conn').textContent=t;$('connDot').classList.toggle('online',o)}function showPanel(id){$('landing').classList.add('hidden');$('playerPanel').classList.add('hidden');$('hostPanel').classList.add('hidden');$(id).classList.remove('hidden');$('homeBtn').classList.remove('hidden')}function normalizeCode(v){return String(v||'').toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g,'').slice(0,6)}function roomFromLocation(){return normalizeCode(new URL(location.href).searchParams.get('room'))}function hostSecretFromLocation(){return new URL(location.href).searchParams.get('host')||''}function participantLink(){const u=new URL(basePath,location.origin);u.searchParams.set('room',room);return u.href}function serverNow(){return Date.now()+clockOffset}function targetText(){if(!state?.hasTarget)return'—';return state.targetVisible?(state.liveTarget??'—'):'?'}function isQueueable(d){return['join','select','setReady'].includes(d.type)}function send(d){if(ws&&ws.readyState===WebSocket.OPEN){ws.send(JSON.stringify(d));return true}if(isQueueable(d)){pending.push(d);if(pending.length>8)pending.shift();msg('Соединение восстанавливается…');openSocket();return false}msg('Нет соединения с сервером');return false}function flushPending(){while(pending.length&&ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(pending.shift()))}
async function createRoom(){msg('');$('createBtn').disabled=true;try{const r=await fetch(apiBase+'create',{method:'POST'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Ошибка создания комнаты');room=d.room;hostSecret=d.hostSecret;localStorage.setItem(hostKeyPrefix+room,hostSecret);const u=new URL(basePath,location.origin);u.searchParams.set('room',room);u.searchParams.set('host',hostSecret);history.replaceState(null,'',u);startHost()}catch(e){msg(e.message)}finally{$('createBtn').disabled=false}}
function openSocket(){if(!room||ws&&(ws.readyState===WebSocket.OPEN||ws.readyState===WebSocket.CONNECTING))return;clearTimeout(retryTimer);manualClose=false;const u=new URL(apiBase+'ws',location.href);u.protocol=location.protocol==='https:'?'wss:':'ws:';u.searchParams.set('room',room);u.searchParams.set('clientId',clientId);u.searchParams.set('role',role);if(role==='host')u.searchParams.set('secret',hostSecret);setConn('подключение…');ws=new WebSocket(u);ws.onopen=()=>{retryCount=0;setConn('в сети',true);msg('');clearInterval(heartbeat);heartbeat=setInterval(()=>{if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'ping'}))},20000);flushPending()};ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='state'){state=d;if(Number.isFinite(d.serverNow))clockOffset=d.serverNow-Date.now();if(Number.isInteger(d.me?.value))choicePending=false;if(role==='host'){if(document.activeElement!==$('targetInput'))$('targetInput').value=d.hasTarget&&Number.isSafeInteger(d.liveTarget)?String(d.liveTarget):'';$('targetVisible').checked=Boolean(d.targetVisible)}render();armCountdown()}else if(d.type==='error'){choicePending=false;msg(d.message);render()}}catch{}};ws.onclose=()=>{clearInterval(heartbeat);setConn('нет связи');if(!manualClose)scheduleReconnect()};ws.onerror=()=>setConn('ошибка связи')}function scheduleReconnect(){clearTimeout(retryTimer);retryTimer=setTimeout(openSocket,Math.min(10000,500*2**Math.min(retryCount++,4)))}function startHost(){role='host';showPanel('hostPanel');$('hostCode').textContent=room;$('hostNameInput').value=localStorage.getItem(nameKey)||'';openSocket()}function startPlayer(){role='player';showPanel('playerPanel');$('playerCode').textContent=room;$('playerCodeInfo').textContent=room;$('nameInput').value=localStorage.getItem(nameKey)||'';openSocket()}function render(){role==='host'?renderHost():renderPlayer()}function countdownOpen(){return state?.countdownMode&&state.phase==='choosing'&&serverNow()>=Number(state.countdownEndsAt||0)}function waitingForAutoReveal(){return state?.countdownMode&&state.phase==='choosing'&&Number.isFinite(state.autoRevealAt)&&state.autoRevealAt>0}
function renderPlayer(){const me=state?.me;if(!me){$('playerJoin').classList.remove('hidden');$('playerPlay').classList.add('hidden');$('playerResult').classList.add('hidden');return}$('playerJoin').classList.add('hidden');if(state.phase==='reveal'&&state.result){$('playerPlay').classList.add('hidden');showResult($('playerResult'),state.result);return}$('playerResult').classList.add('hidden');$('playerPlay').classList.remove('hidden');$('roundInfo').textContent=state.phase==='choosing'?`раунд ${state.round}`:'ожидание раунда';$('targetDisplay').textContent=targetText();if(state.phase!=='choosing'){setNumberState($('numbers'),null,true);$('readyBtn').classList.remove('hidden');$('readyBtn').disabled=true;$('playerHint').textContent='Ожидайте начала раунда';return}if(state.countdownMode){$('readyBtn').classList.add('hidden');const selected=Number.isInteger(me.value),disabled=!me.eligible||!countdownOpen()||selected||choicePending||waitingForAutoReveal();setNumberState($('numbers'),me.value,disabled);$('playerHint').textContent=!me.eligible?'Вы вошли после начала. Ждите следующий раунд.':!countdownOpen()?'Приготовьтесь…':waitingForAutoReveal()?'Все выбрали. Результат через 2 секунды…':selected?'Выбор принят.':'Выберите одно число.';return}$('readyBtn').classList.remove('hidden');setNumberState($('numbers'),me.value,me.ready);$('readyBtn').disabled=!me.ready&&!Number.isInteger(me.value);$('readyBtn').textContent=me.ready?'Изменить выбор':'Готов';$('readyBtn').classList.toggle('ready',me.ready);$('playerHint').textContent=me.ready?'Вы готовы. Нажмите, чтобы изменить число.':'Выберите число и подтвердите.'}
function renderHost(){const players=state?.players||[],done=players.filter(p=>state.countdownMode?p.chosen:p.ready).length;$('readyInfo').textContent=state.countdownMode?`выбрали ${done}/${players.length}`:`готовы ${done}/${players.length}`;$('hostPlayers').innerHTML=players.length?players.map(p=>`<div class="player"><span>${escapeHtml(p.name)}${p.clientId===clientId?' <span class="muted">(вы)</span>':''}</span><strong>${state.countdownMode?(p.chosen?'✓':'…'):(p.ready?'✓':'…')}</strong></div>`).join(''):'<div class="small muted">Пока никто не подключён</div>';$('revealBtn').classList.toggle('hidden',state.phase==='choosing'&&state.countdownMode);$('revealBtn').disabled=!(state.phase==='choosing'&&!state.countdownMode&&state.allReady);state.phase==='reveal'&&state.result?showResult($('hostResult'),state.result):$('hostResult').classList.add('hidden');const me=state.me;if(!me){$('hostJoin').classList.remove('hidden');$('hostPlayControls').classList.add('hidden');return}$('hostJoin').classList.add('hidden');$('hostPlayControls').classList.remove('hidden');$('hostChoice').textContent=targetText();if(state.phase!=='choosing'){setNumberState($('hostNumbers'),null,true);$('hostReadyBtn').classList.remove('hidden');$('hostReadyBtn').disabled=true;$('hostHint').textContent=state.phase==='reveal'?'Раунд завершён':'Ожидайте начала раунда';return}if(state.countdownMode){$('hostReadyBtn').classList.add('hidden');const selected=Number.isInteger(me.value),disabled=!me.eligible||!countdownOpen()||selected||choicePending||waitingForAutoReveal();setNumberState($('hostNumbers'),me.value,disabled);$('hostHint').textContent=!me.eligible?'Вы вошли после начала. Следующий раунд.':!countdownOpen()?'Приготовьтесь…':waitingForAutoReveal()?'Все выбрали. Результат через 2 секунды…':selected?'Выбор принят.':'Выберите одно число.';return}$('hostReadyBtn').classList.remove('hidden');setNumberState($('hostNumbers'),me.value,me.ready);$('hostReadyBtn').disabled=!me.ready&&!Number.isInteger(me.value);$('hostReadyBtn').textContent=me.ready?'Изменить выбор':'Готов';$('hostReadyBtn').classList.toggle('ready',me.ready);$('hostHint').textContent=me.ready?'Вы участвуете в сумме.':'Выберите число от 0 до 5.'}
function showResult(el,r){const shownTarget=r.success||state?.targetVisible?(r.target??'?'):'?';el.classList.remove('hidden');el.innerHTML=`<div class="resultWord ${r.success?'ok':'bad'}">${r.success?'Совпало!':'Не совпало'}</div><div class="scoreline"><div class="scorebox"><div class="t">Цель</div><div class="n">${shownTarget}</div></div><div class="scorebox"><div class="t">Сумма</div><div class="n">${r.sum}</div></div></div><details><summary>Числа участников</summary><div class="players" style="margin-top:8px">${r.players.map(p=>`<div class="player"><span>${escapeHtml(p.name)}</span><strong>${p.value}</strong></div>`).join('')}</div></details>`}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setNumberState(c,v,d){[...c.children].forEach(b=>{b.disabled=d;b.classList.toggle('selected',Number(b.dataset.value)===v)})}function chooseNumber(v){if(state?.countdownMode&&state.phase==='choosing'){if(choicePending||Number.isInteger(state.me?.value)||!state.me?.eligible||!countdownOpen())return;choicePending=true;render()}send({type:'select',value:v})}function makeNumbers(c){for(let i=0;i<=5;i++){const b=document.createElement('button');b.className='numberbtn';b.textContent=i;b.dataset.value=i;b.onclick=()=>chooseNumber(i);c.appendChild(b)}}makeNumbers($('numbers'));makeNumbers($('hostNumbers'));
function updateCountdown(){if(!state?.countdownMode||state.phase!=='choosing'||!state.countdownEndsAt){$('countdownOverlay').classList.add('hidden');clearInterval(countdownTicker);countdownTicker=null;return}const diff=Number(state.countdownEndsAt)-serverNow();if(diff>0){$('countdownOverlay').classList.remove('hidden');$('countdownText').classList.remove('start');$('countdownText').textContent=String(Math.ceil(diff/1000));return}if(diff>-800){$('countdownOverlay').classList.remove('hidden');$('countdownText').classList.add('start');$('countdownText').textContent='СТАРТ';render();return}$('countdownOverlay').classList.add('hidden');clearInterval(countdownTicker);countdownTicker=null;render()}function armCountdown(){clearInterval(countdownTicker);countdownTicker=null;updateCountdown();if(state?.countdownMode&&state.phase==='choosing'&&serverNow()<Number(state.countdownEndsAt||0)+800)countdownTicker=setInterval(updateCountdown,80)}
$('createBtn').onclick=createRoom;$('joinCode').oninput=e=>e.target.value=normalizeCode(e.target.value);$('joinByCode').onclick=()=>{const c=normalizeCode($('joinCode').value);if(c.length!==6)return msg('Введите код комнаты');const u=new URL(basePath,location.origin);u.searchParams.set('room',c);location.href=u.href};$('copyLink').onclick=async()=>{await navigator.clipboard.writeText(participantLink());msg('Ссылка скопирована')};$('shareLink').onclick=async()=>{const url=participantLink();if(navigator.share)await navigator.share({title:'Игра «Сумма»',url});else{await navigator.clipboard.writeText(url);msg('Ссылка скопирована')}};$('targetVisible').onchange=()=>send({type:'setTargetVisible',visible:$('targetVisible').checked});$('targetInput').oninput=()=>{clearTimeout(targetDebounce);targetDebounce=setTimeout(()=>{const raw=$('targetInput').value.trim();if(raw==='')return send({type:'setTarget',target:null});if(!/^-?\d+$/.test(raw))return;const v=Number(raw);if(Number.isSafeInteger(v)&&Math.abs(v)<=1000000000)send({type:'setTarget',target:v})},80)};$('startRound').onclick=()=>{const raw=$('targetInput').value.trim();if(raw==='')return msg('Введите целое число');const v=Number(raw);if(!Number.isSafeInteger(v))return msg('Введите целое число');choicePending=false;send({type:'startRound',target:v,countdownMode:$('countdownMode').checked})};$('revealBtn').onclick=()=>send({type:'reveal'});function joinWithName(i){const name=i.value.trim();if(!name)return msg('Введите имя');localStorage.setItem(nameKey,name);send({type:'join',name})}$('saveName').onclick=()=>joinWithName($('nameInput'));$('hostJoinBtn').onclick=()=>joinWithName($('hostNameInput'));$('readyBtn').onclick=()=>{if(state?.me&&!state.countdownMode)send({type:'setReady',ready:!state.me.ready})};$('hostReadyBtn').onclick=()=>{if(state?.me&&!state.countdownMode)send({type:'setReady',ready:!state.me.ready})};$('homeBtn').onclick=()=>{manualClose=true;clearInterval(heartbeat);clearInterval(countdownTicker);try{ws?.close()}catch{};history.replaceState(null,'',basePath);location.reload()};window.addEventListener('online',()=>openSocket());document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(!ws||ws.readyState>1))openSocket()});room=roomFromLocation();if(room){hostSecret=hostSecretFromLocation()||localStorage.getItem(hostKeyPrefix+room)||'';hostSecret?startHost():startPlayer()}else setConn('готово')
})();
